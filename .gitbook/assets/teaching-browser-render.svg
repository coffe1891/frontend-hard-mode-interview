<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description"><title id="title">浏览器如何把网页变成画面</title><desc id="description">先取资源，再生成结构与样式，最后确定位置并绘制。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L9 3 z" fill="#3778ba"/></marker></defs><rect width="960" height="420" rx="20" fill="#ffffff" stroke="#d9e2ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="45" font-size="27" font-weight="700" fill="#183153" text-anchor="start">浏览器如何把网页变成画面</text><text x="38" y="75" font-size="17" font-weight="400" fill="#54657c" text-anchor="start">先取资源，再生成结构与样式，最后确定位置并绘制。</text><line x1="38" y1="92" x2="922" y2="92" stroke="#91a6bb" stroke-width="2" /><rect x="44" y="115" width="236" height="74" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="162" y="150" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">访问网址</text><text x="162" y="182" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">URL、缓存、网络请求</text><rect x="359" y="115" width="236" height="74" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="477" y="150" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">解析 HTML 与 CSS</text><text x="477" y="182" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">获得文档和样式规则</text><rect x="674" y="115" width="236" height="74" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="792" y="150" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">构建渲染所需数据</text><text x="792" y="182" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">脚本可能影响解析过程</text><line x1="280" y1="151" x2="358" y2="151" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="595" y1="151" x2="673" y2="151" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><rect x="50" y="235" width="166" height="74" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="133" y="270" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">DOM</text><text x="133" y="302" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">文档节点树</text><rect x="50" y="324" width="166" height="70" rx="14" fill="#f0eaff" stroke="#7658a9" stroke-width="2"/><text x="133" y="359" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">CSSOM</text><text x="133" y="391" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">样式规则</text><rect x="328" y="274" width="166" height="85" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="411" y="309" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">样式计算</text><text x="411" y="341" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">哪些规则生效</text><rect x="577" y="274" width="142" height="85" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="648" y="309" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">布局</text><text x="648" y="341" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">大小与位置</text><rect x="800" y="274" width="125" height="85" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="862.5" y="309" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">绘制/合成</text><text x="862.5" y="341" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">屏幕像素</text><line x1="216" y1="273" x2="327" y2="307" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="216" y1="359" x2="327" y2="330" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="494" y1="316" x2="576" y2="316" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="719" y1="316" x2="799" y2="316" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="789" y1="189" x2="789" y2=