<svg xmlns="http://www.w3.org/2000/svg" width="960" height="415" viewBox="0 0 960 415" role="img" aria-labelledby="title description"><title id="title">MVC：输入、业务规则、展示分开</title><desc id="description">购物车例子：用户触发操作，控制器协调模型计算与界面显示。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L9 3 z" fill="#3778ba"/></marker></defs><rect width="960" height="415" rx="20" fill="#fff" stroke="#d9e2ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="45" font-size="27" font-weight="700" fill="#183153" text-anchor="start">MVC：输入、业务规则、展示分开</text><text x="38" y="75" font-size="17" font-weight="400" fill="#54657c" text-anchor="start">购物车例子：用户触发操作，控制器协调模型计算与界面显示。</text><line x1="38" y1="92" x2="922" y2="92" stroke="#dce5ee" stroke-width="2"/><rect x="30" y="145" width="189" height="93" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="124.5" y="181" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">用户操作</text><text x="124.5" y="210" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">点击结算</text><rect x="303" y="145" width="219" height="93" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="412.5" y="181" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">Controller</text><text x="412.5" y="210" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">接收事件 / 协调</text><rect x="619" y="145" width="285" height="93" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="761.5" y="181" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">Model</text><text x="761.5" y="210" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">校验价格 / 计算总额</text><path d="M219 191 L302 191" fill="none" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><path d="M522 191 L618 191" fill="none" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><rect x="303" y="302" width="219" height="77" rx="14" fill="#f0eaff" stroke="#7658a9" stroke-width="2"/><text x="412.5" y="338" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">View</text><text x="412.5" y="367" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">显示结果、反馈错误</text><path d="M758 239 C758 272 523 275 523 336" stroke="#3778ba" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="735" y="294" font-size="16" font-weight="500" fill="#54657c" text-anchor="middle">结果供界面展示</text><text x="40" y="404" font-size="16" font-weight="500" fill="#54657c" text-anchor="start">分层的价值：只改页面布局时，不需要重写计价公式。</text></g></svg>
