<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Angular 长列表虚拟滚动只渲染可见范围及少量缓冲内容</title><desc id="desc">几千条数据不必同时变成几千个 DOM 行；虚拟滚动减少渲染节点，但仍需要按项目配置验证。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="14" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="35" y="36" width="425" height="210" rx="14" fill="#fff" stroke="#d5e2ef" stroke-width="2"/><text x="244" y="73" font-size="22" font-weight="700" fill="#263650" text-anchor="middle">全部渲染 3000 行</text><rect x="67" y="90" width="350" height="15" rx="5" fill="#e7f1fc" stroke="#e1eaf6" stroke-width="2"/><rect x="67" y="112" width="350" height="15" rx="5" fill="#f0ebfb" stroke="#e1eaf6" stroke-width="2"/><rect x="67" y="134" width="350" height="15" rx="5" fill="#e7f1fc" stroke="#e1eaf6" stroke-width="2"/><rect x="67" y="156" width="350" height="15" rx="5" fill="#f0ebfb" stroke="#e1eaf6" stroke-width="2"/><rect x="67" y="178" width="350" height="15" rx="5" fill="#e7f1fc" stroke="#e1eaf6" stroke-width="2"/><rect x="67" y="200" width="350" height="15" rx="5" fill="#f0ebfb" stroke="#e1eaf6" stroke-width="2"/><text x="244" y="232" font-size="16" font-weight="500" fill="#627389" text-anchor="middle">还有大量不可见的 DOM 节点</text><rect x="498" y="36" width="425" height="210" rx="14" fill="#fff" stroke="#d5e2ef" stroke-width="2"/><text x="709" y="73" font-size="22" font-weight="700" fill="#263650" text-anchor="middle">虚拟滚动</text><rect x="539" y="91" width="327" height="115" rx="9" fill="#f9fcff" stroke="#a1bcd8" stroke-width="2"/><rect x="558" y="104" width="286" height="19" rx="5" fill="#e7f1fc" stroke="#dce8f3" stroke-width="2"/><rect x="558" y="132" width="286" height="19" rx="5" fill="#e8f5ef" stroke="#dce8f3" stroke-width="2"/><rect x="558" y="160" width="286" height="19" rx="5" fill="#e7f1fc" stroke="#dce8f3" stroke-width="2"/><path d="M871 100V195" stroke="#c3d0df" stroke-width="6" stroke-linecap="round"/><path d="M871 110V148" stroke="#7caad8" stroke-width="6" stroke-linecap="round"/><text x="707" y="232" font-size="16" font-weight="500" fill="#627389" text-anchor="middle">只保留可见区域与缓冲行</text><text x="479" y="278" font-size="17" font-weight="450" fill="#627389" text-anchor="middle">实际 DOM 数量取决于可视区域、行高与缓冲设置</text></g></svg>
