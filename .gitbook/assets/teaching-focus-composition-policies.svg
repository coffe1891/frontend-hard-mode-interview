<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">运费折扣由独立规则函数组合计算，不需要复杂的继承子类</title><desc id="desc">原文订单不是 VIP，但金额 600：VIP 规则返回 0，大额订单规则返回 15，最终选最大优惠 15。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce5ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="40" y="91" width="221" height="99" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="150.5" y="126" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">订单</text><text x="150.5" y="157" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">VIP=false，总额 600</text><path d="M274 142 L332 142" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="341" y="43" width="239" height="75" rx="14" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="460.5" y="78" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">VIP 规则</text><text x="460.5" y="109" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">优惠 0 元</text><rect x="341" y="172" width="239" height="75" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="460.5" y="207" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">满额规则</text><text x="460.5" y="238" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">优惠 15 元</text><path d="M588 81 L677 137" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M588 209 L677 149" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="688" y="95" width="226" height="103" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="801" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">Math.max(0,15)</text><text x="801" y="161" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">最终优惠 15 元</text><text x="480" y="276" text-anchor="middle" font-size="18" font-weight="500" fill="#61748b">新增优惠规则只需增加一个函数，不必改动继承树</text></g></svg>
