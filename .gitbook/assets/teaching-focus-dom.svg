<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">DOM、Shadow DOM 与 Virtual DOM 的不同职责</title><desc id="desc">DOM 是真实页面节点树；Shadow DOM 提供组件封装边界；Virtual DOM 是用于描述界面的内存结构。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6c91c1"/></marker></defs><rect x="1" y="1" width="958" height="298" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="19" y="42" width="295" height="215" rx="12" fill="#fff" stroke="#d9e2ee" stroke-width="2"/><rect x="47" y="66" width="239" height="50" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="167" y="98" text-anchor="middle" font-size="22" font-weight="650" fill="#263650">DOM</text><text x="167" y="146" text-anchor="middle" font-size="17" font-weight="500" fill="#627389">实际节点树</text><rect x="111" y="169" width="112" height="48" rx="8" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="167" y="198" text-anchor="middle" font-size="15" font-weight="550" fill="#263650">页面元素</text><rect x="335" y="42" width="295" height="215" rx="12" fill="#fff" stroke="#d9e2ee" stroke-width="2"/><rect x="363" y="66" width="239" height="50" rx="12" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="483" y="98" text-anchor="middle" font-size="22" font-weight="650" fill="#263650">Shadow DOM</text><text x="483" y="146" text-anchor="middle" font-size="17" font-weight="500" fill="#627389">封装组件内部</text><rect x="416" y="169" width="132" height="52" rx="8" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="482" y="202" text-anchor="middle" font-size="16" font-weight="550" fill="#263650">组件边界内</text><rect x="651" y="42" width="295" height="215" rx="12" fill="#fff" stroke="#d9e2ee" stroke-width="2"/><rect x="679" y="66" width="239" height="50" rx="12" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="799" y="98" text-anchor="middle" font-size="22" font-weight="650" fill="#263650">Virtual DOM</text><text x="799" y="146" text-anchor="middle" font-size="17" font-weight="500" fill="#627389">描述并协调更新</text><rect x="714" y="169" width="170" height="48" rx="8" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="799" y="198" text-anchor="middle" font-size="15" font-weight="550" fill="#263650">更新真实 DOM</text><text x="478" y="281" text-anchor="middle" font-size="17" font-weight="450" fill="#627389">三者都与界面有关，却解决不同问题。</text></g></svg>
