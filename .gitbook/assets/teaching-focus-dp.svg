<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">找零六元时贪心方案三枚硬币，而最优方案仅两枚硬币</title><desc id="desc">面额只有 1、3、4 时，先拿最大面额会错过 3+3 的最优解。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="242" y="60" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">贪心：先取最大的</text><text x="719" y="60" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">最优方案：比较组合</text><circle cx="130" cy="143" r="42" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="130" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">4</text><circle cx="245" cy="143" r="42" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="245" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">1</text><circle cx="360" cy="143" r="42" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="360" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">1</text><text x="242" y="242" text-anchor="middle" font-size="20" font-weight="650" fill="#b0784f">4 + 1 + 1 = 3 枚</text><circle cx="657" cy="143" r="42" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="657" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">3</text><circle cx="782" cy="143" r="42" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="782" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">3</text><text x="718" y="242" text-anchor="middle" font-size="20" font-weight="650" fill="#37876d">3 + 3 = 2 枚</text><path d="M479 40 L479 258" fill="none" stroke="#dbe3ec" stroke-width="2" stroke-linecap="round"/></g></svg>
