<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">组合模式让购物车、套装和单品都通过同一个 price 方法计算总价</title><desc id="desc">购物车 price() 递归求和：护理套装含牙刷 15 元、牙膏 25 元，另有毛巾 20 元，总价 60 元。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6c91c1"/></marker></defs><rect x="1" y="1" width="958" height="298" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="349" y="30" width="259" height="58" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="479" y="67" text-anchor="middle" font-size="19" font-weight="700" fill="#263650">购物车 price() = 60</text><path d="M479,89 L479,112" fill="none" stroke="#9aafc5" stroke-width="2.5" stroke-linecap="round"/><path d="M257,112 L744,112" fill="none" stroke="#9aafc5" stroke-width="2.5" stroke-linecap="round"/><path d="M257,112 L257,133" fill="none" stroke="#9aafc5" stroke-width="2.5" stroke-linecap="round"/><path d="M744,112 L744,133" fill="none" stroke="#9aafc5" stroke-width="2.5" stroke-linecap="round"/><rect x="92" y="136" width="323" height="63" rx="12" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="254" y="175" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">护理套装 price() = 40</text><rect x="623" y="136" width="247" height="63" rx="12" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="747" y="175" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">毛巾 ¥20</text><path d="M254,201 L254,226" fill="none" stroke="#9aafc5" stroke-width="2.5" stroke-linecap="round"/><path d="M154,226 L353,226" fill="none" stroke="#9aafc5" stroke-width="2.5" stroke-linecap="round"/><path d="M154,226 L154,247" fill="none" stroke="#9aafc5" stroke-width="2.5" stroke-linecap="round"/><path d="M353,226 L353,247" fill="none" stroke="#9aafc5" stroke-width="2.5" stroke-linecap="round"/><rect x="67" y="247" width="176" height="39" rx="12" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="155" y="273" text-anchor="middle" font-size="17" font-weight="600" fill="#263650">牙刷 ¥15</text><rect x="265" y="247" width="176" height="39" rx="12" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="354" y="273" text-anchor="middle" font-size="17" font-weight="600" fill="#263650">牙膏 ¥25</text><text x="698" y="254" text-anchor="middle" font-size="17" font-weight="500" fill="#627389">父节点统一调用</text><text x="698" y="279" text-anchor="middle" font-size="17" font-weight="500" fill="#627389">每个子节点的 price()</text></g></svg>
