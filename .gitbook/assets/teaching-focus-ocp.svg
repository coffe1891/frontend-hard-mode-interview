<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">冰淇淋制作函数无需修改，通过 addFlavor 扩展新口味</title><desc id="desc">原文示例中，新增草莓口味可以调用 `addFlavor(&apos;草莓&apos;)`，不必打开并修改已测试的 `makeIceCream()` 实现。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce5ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="54" y="101" width="256" height="106" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="182" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">makeIceCream()</text><text x="182" y="163" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">已稳定的制作流程</text><path d="M322 155 L423 155" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="436" y="74" width="239" height="155" rx="14" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="555.5" y="108" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">可用口味</text><text x="555.5" y="136" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">巧克力 / 香草</text><path d="M689 153 L762 153" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="774" y="101" width="151" height="106" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="849.5" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">新增草莓</text><text x="849.5" y="163" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">addFlavor()</text><text x="481" y="52" text-anchor="middle" font-size="22" font-weight="650" fill="#263650">需求新增一种口味，无需重写制作流程</text><text x="480" y="270" text-anchor="middle" font-size="17" font-weight="500" fill="#61748b">对扩展开放，不等于已发布的代码永远不能修正</text></g></svg>
