<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">spread 将数组元素展开为参数，rest 将多个实参收集成数组</title><desc id="desc">`...` 在调用处是展开（spread），在形参处是收集（rest）；关键看它出现的位置。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce5ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="28" y="40" width="438" height="207" rx="14" fill="#fff" stroke="#d9e4f1" stroke-width="2"/><text x="248" y="79" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">调用时：spread 展开</text><rect x="59" y="114" width="177" height="75" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="147.5" y="149" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">[1, 2, 3]</text><text x="147.5" y="180" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">数组</text><path d="M241 150 L284 150" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="293" y="114" width="145" height="75" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="365.5" y="149" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">fn(1,2,3)</text><text x="365.5" y="180" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">三个实参</text><rect x="495" y="40" width="438" height="207" rx="14" fill="#fff" stroke="#d9e4f1" stroke-width="2"/><text x="714" y="79" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">定义时：rest 收集</text><rect x="523" y="114" width="166" height="75" rx="14" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="606" y="149" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">fn(1,2,3)</text><text x="606" y="180" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">多个实参</text><path d="M694 150 L736 150" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="744" y="114" width="165" height="75" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="826.5" y="149" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">...args</text><text x="826.5" y="180" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">得到数组</text><text x="480" y="271" text-anchor="middle" font-size="18" font-weight="500" fill="#61748b">同样三个点：调用时拆开，定义参数时装起来</text></g></svg>
