<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">改变元素宽度触发布局计算，改变背景颜色通常只需绘制</title><desc id="desc">宽度变化通常会涉及布局和绘制；单纯改 background-color 通常无需重新布局。具体开销依赖浏览器优化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6c91c1"/></marker></defs><rect x="1" y="1" width="958" height="298" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="26" y="42" width="441" height="211" rx="12" fill="#fff" stroke="#d7e1ed" stroke-width="2"/><rect x="492" y="42" width="441" height="211" rx="12" fill="#fff" stroke="#d7e1ed" stroke-width="2"/><text x="241" y="77" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">修改 width：重排（Layout）</text><rect x="84" y="103" width="100" height="52" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><path d="M208,130 L260,130" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="278" y="103" width="141" height="52" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="240" y="201" text-anchor="middle" font-size="19" font-weight="550" fill="#557fa9">样式 → 布局 → 绘制</text><text x="710" y="77" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">修改颜色：重绘（Paint）</text><rect x="550" y="103" width="110" height="52" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><path d="M684,130 L727,130" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="747" y="103" width="110" height="52" rx="12" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="709" y="201" text-anchor="middle" font-size="19" font-weight="550" fill="#557fa9">布局不变 → 绘制更新</text><text x="478" y="277" text-anchor="middle" font-size="17" font-weight="450" fill="#627389">改变几何尺寸通常比改变纯视觉样式涉及更多阶段。</text></g></svg>
