<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">浅拷贝与原对象共享嵌套对象，深拷贝创建独立嵌套对象</title><desc id="desc">浅拷贝只复制第一层，嵌套的 address 仍是同一个对象；深拷贝会创建独立副本（具体类型仍要正确处理）。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="14" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="355" y="28" width="249" height="69" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="479.5" y="61" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">原对象 user</text><text x="479.5" y="89" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">address 指向对象 A</text><path d="M433 103 L234 152" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><path d="M536 103 L723 152" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="47" y="164" width="365" height="102" rx="14" fill="#fff" stroke="#b8cde3" stroke-width="2"/><text x="232" y="193" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">浅拷贝 {...user}</text><text x="232" y="227" font-size="22" font-weight="700" fill="#b0784f" text-anchor="middle">address 仍指向 A</text><text x="232" y="249" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">改 city 可能影响原对象</text><rect x="546" y="164" width="365" height="102" rx="14" fill="#fff" stroke="#b8cde3" stroke-width="2"/><text x="728" y="193" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">深拷贝</text><text x="728" y="227" font-size="22" font-weight="700" fill="#3a9176" text-anchor="middle">address 指向新对象 B</text><text x="728" y="249" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">改 city 不影响原对象</text><text x="480" y="290" font-size="17" font-weight="500" fill="#627389" text-anchor="middle">关键只看一件事：嵌套对象是不是同一份</text></g></svg>
