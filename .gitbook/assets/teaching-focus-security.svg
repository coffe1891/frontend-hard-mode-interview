<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">XSS 让恶意脚本在页面执行，CSRF 利用已登录浏览器发起跨站请求</title><desc id="desc">XSS 涉及不可信脚本在页面环境中执行；CSRF 涉及跨站请求携带凭据，是否携带 Cookie 受 SameSite 等策略影响。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6c91c1"/></marker></defs><rect x="1" y="1" width="958" height="298" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="22" y="47" width="448" height="210" rx="12" fill="#fff" stroke="#dce4ee" stroke-width="2"/><rect x="489" y="47" width="448" height="210" rx="12" fill="#fff" stroke="#dce4ee" stroke-width="2"/><text x="246" y="82" text-anchor="middle" font-size="21" font-weight="650" fill="#263650">XSS：脚本混入页面</text><rect x="43" y="118" width="116" height="73" rx="12" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="101" y="149" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">恶意脚本</text><text x="101" y="177" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">注入</text><rect x="189" y="118" width="114" height="73" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="246" y="149" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">受害页面</text><text x="246" y="177" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">渲染</text><rect x="334" y="118" width="115" height="73" rx="12" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="391.5" y="149" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">用户浏览器</text><text x="391.5" y="177" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">执行脚本</text><path d="M161,154 L186,154" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M305,154 L331,154" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="714" y="82" text-anchor="middle" font-size="21" font-weight="650" fill="#263650">CSRF：借登录态发请求</text><rect x="513" y="118" width="117" height="73" rx="12" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="571.5" y="149" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">其他网站</text><text x="571.5" y="177" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">诱导</text><rect x="664" y="118" width="116" height="73" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="722" y="149" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">已登录浏览器</text><text x="722" y="177" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">请求</text><rect x="810" y="118" width="106" height="73" rx="12" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="863" y="149" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">目标站点</text><text x="863" y="177" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">处理</text><path d="M632,154 L661,154" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M782,154 L807,154" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="717" y="230" text-anchor="middle" font-size="15" font-weight="450" fill="#627389">需满足凭据携带等条件</text><text x="480" y="280" text-anchor="middle" font-size="18" font-weight="460" fill="#627389">两个风险的入口不同，防护方式也不同。</text></g></svg>
