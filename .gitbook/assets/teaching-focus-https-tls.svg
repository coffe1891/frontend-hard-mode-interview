<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">HTTP 明文传输与 HTTPS 通过 TLS 保护传输内容的区别</title><desc id="desc">HTTPS 会在传输过程中用 TLS 保护 HTTP 数据，并通过证书等机制验证服务器身份；不代表网站业务本身绝对安全。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="14" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="40" y="42" width="424" height="204" rx="14" fill="#fff" stroke="#d5e2ef" stroke-width="2"/><text x="252" y="78" font-size="23" font-weight="700" fill="#263650" text-anchor="middle">HTTP</text><rect x="65" y="110" width="107" height="76" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="118.5" y="144" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">浏览器</text><text x="118.5" y="172" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">请求</text><path d="M182 150 L328 150" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="342" y="110" width="102" height="76" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="393" y="144" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">服务器</text><text x="393" y="172" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">响应</text><rect x="192" y="119" width="120" height="45" rx="9" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="252" y="147" font-size="17" font-weight="600" fill="#263650" text-anchor="middle">明文可见</text><rect x="492" y="42" width="428" height="204" rx="14" fill="#fff" stroke="#d5e2ef" stroke-width="2"/><text x="706" y="78" font-size="23" font-weight="700" fill="#263650" text-anchor="middle">HTTPS</text><rect x="507" y="110" width="107" height="76" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="560.5" y="144" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">浏览器</text><text x="560.5" y="172" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">请求</text><rect x="625" y="108" width="167" height="81" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="708" y="140" font-size="18" font-weight="650" fill="#263650" text-anchor="middle">TLS 加密通道</text><text x="708" y="164" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">证书验证</text><path d="M617 151 L622 151" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><path d="M793 151 L805 151" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="809" y="110" width="101" height="76" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="859.5" y="144" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">服务器</text><text x="859.5" y="172" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">响应</text><text x="480" y="279" font-size="17" font-weight="450" fill="#627389" text-anchor="middle">HTTPS 保护传输内容；业务漏洞仍需单独防范</text></g></svg>
