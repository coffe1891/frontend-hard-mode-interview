<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">把同时负责计算、保存和通知的订单模块拆成各自独立职责</title><desc id="desc">订单计算、数据库保存、发送邮件有不同的变更原因，拆开后修改其中一个功能不必触碰全部逻辑。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce5ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="33" y="90" width="320" height="117" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="193" y="124" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">万能订单类</text><text x="193" y="152" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">计算 + 存储 + 通知</text><path d="M367 148 L443 148" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="472" y="43" width="392" height="61" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="668" y="78" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">价格计算</text><rect x="472" y="123" width="392" height="61" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="668" y="158" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">数据存储</text><rect x="472" y="203" width="392" height="61" rx="14" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="668" y="238" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">消息通知</text><text x="485" y="280" text-anchor="middle" font-size="17" font-weight="500" fill="#61748b">按照不同的变化原因拆分职责，比按方法数量拆分更合理</text></g></svg>
