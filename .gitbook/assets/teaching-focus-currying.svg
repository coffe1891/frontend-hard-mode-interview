<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">柯里化将 add(x,y) 变成 add(x)(y)，先固定一个参数再补另一个</title><desc id="desc">`add(1)(2)` 先记住 x=1，再接收 y=2；新函数复用了预先保存的参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce5ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="239" y="54" text-anchor="middle" font-size="21" font-weight="650" fill="#263650">普通调用</text><rect x="65" y="86" width="350" height="101" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="240" y="121" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">add(1, 2)</text><text x="240" y="152" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">一次传入两个参数</text><path d="M423 135 L496 135" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><text x="637" y="54" text-anchor="middle" font-size="21" font-weight="650" fill="#263650">柯里化</text><rect x="516" y="90" width="172" height="96" rx="14" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="602" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">add(1)</text><text x="602" y="156" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">记住 x=1</text><path d="M700 136 L738 136" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="744" y="90" width="170" height="96" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="829" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">(2)</text><text x="829" y="156" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">补上 y=2</text><text x="236" y="229" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">结果：3</text><text x="716" y="229" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">结果：3</text><text x="478" y="274" text-anchor="middle" font-size="17" font-weight="500" fill="#61748b">可以先固定一个参数，得到可复用的新函数</text></g></svg>
