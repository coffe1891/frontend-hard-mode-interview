<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">门面模式通过一个接口调用多个业务子系统</title><desc id="desc">调用方只接触 CheckoutFacade，后者统一调用库存、支付和订单服务。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#769bc4"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce5ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="475" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#263650">一次下单，由一个入口协调多个服务</text><rect x="28" y="100" width="197" height="106" rx="14" fill="#e7f1fc" stroke="#83b2df" stroke-width="2"/><text x="127" y="140" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">页面 / 调用方</text><text x="127" y="170" text-anchor="middle" font-size="16" font-weight="500" fill="#263650">checkout(cart)</text><path d="M234 152 L314 152" stroke="#769bc4" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round"/><rect x="327" y="100" width="246" height="106" rx="14" fill="#f0ebfa" stroke="#b29cdd" stroke-width="2"/><text x="450" y="138" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">CheckoutFacade</text><text x="450" y="171" text-anchor="middle" font-size="17" font-weight="500" fill="#263650">统一下单入口</text><path d="M583 152 L661 152" stroke="#769bc4" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round"/><rect x="675" y="50" width="244" height="59" rx="14" fill="#e8f5ef" stroke="#8ebea6" stroke-width="2"/><text x="797" y="86" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">库存服务：校验</text><rect x="675" y="119" width="244" height="59" rx="14" fill="#fff0df" stroke="#daa66e" stroke-width="2"/><text x="797" y="155" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">支付服务：扣款</text><rect x="675" y="188" width="244" height="59" rx="14" fill="#e8f1fc" stroke="#87b2df" stroke-width="2"/><text x="797" y="224" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">订单服务：保存</text><path d="M627 151 L627 79 L660 79" stroke="#769bc4" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M627 151 L660 151" stroke="#769bc4" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M627 151 L627 217 L660 217" stroke="#769bc4" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="481" y="279" text-anchor="middle" font-size="17" font-weight="450" fill="#627389">调用方无需知道内部的步骤与子系统接口。</text></g></svg>
