<svg xmlns="http://www.w3.org/2000/svg" width="960" height="435" viewBox="0 0 960 435" role="img" aria-labelledby="title description"><title id="title">Webpack：从模块依赖图到按需加载</title><desc id="description">初次访问先用入口代码，只有打开报表时才请求报表模块。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L9 3 z" fill="#3778ba"/></marker></defs><rect width="960" height="435" rx="20" fill="#fff" stroke="#d9e2ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="45" font-size="27" font-weight="700" fill="#183153" text-anchor="start">Webpack：从模块依赖图到按需加载</text><text x="38" y="75" font-size="17" font-weight="400" fill="#54657c" text-anchor="start">初次访问先用入口代码，只有打开报表时才请求报表模块。</text><line x1="38" y1="92" x2="922" y2="92" stroke="#dce5ee" stroke-width="2"/><rect x="30" y="128" width="201" height="91" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="130.5" y="164" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">src/index.js</text><text x="130.5" y="193" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">应用入口</text><rect x="328" y="117" width="226" height="99" rx="14" fill="#f0eaff" stroke="#7658a9" stroke-width="2"/><text x="441" y="153" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">模块依赖图</text><text x="441" y="182" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">main、ui、report</text><rect x="647" y="117" width="268" height="98" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="781" y="153" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">Webpack 构建</text><text x="781" y="182" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">转译、优化、拆包</text><path d="M231 170 L327 170" fill="none" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><path d="M554 166 L646 166" fill="none" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><rect x="186" y="293" width="250" height="90" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="311" y="329" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">入口 chunk</text><text x="311" y="358" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">页面启动时加载</text><rect x="548" y="293" width="250" height="90" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="673" y="329" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">报表 chunk</text><text x="673" y="358" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">点击后按需加载</text><path d="M746 217 L746 292" fill="none" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><path d="M714 216 C714 251 314 255 314 292" stroke="#3778ba" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="489" y="412" font-size="17" font-weight="500" fill="#54657c" text-anchor="middle">代码拆分不是无脑拆碎：拆包过多也有请求和运行成本。</text></g></svg>
