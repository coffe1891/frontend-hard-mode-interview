<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title description"><title id="title">订单状态机：不是任何状态都能做任何操作</title><desc id="description">箭头上的动作发生时，订单才允许转移到下一个状态。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L9 3 z" fill="#3778ba"/></marker></defs><rect width="960" height="440" rx="20" fill="#fff" stroke="#d9e2ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="45" font-size="27" font-weight="700" fill="#183153" text-anchor="start">订单状态机：不是任何状态都能做任何操作</text><text x="38" y="75" font-size="17" font-weight="400" fill="#54657c" text-anchor="start">箭头上的动作发生时，订单才允许转移到下一个状态。</text><line x1="38" y1="92" x2="922" y2="92" stroke="#dce5ee" stroke-width="2"/><rect x="38" y="145" width="184" height="86" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="130" y="181" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">待支付</text><text x="130" y="212" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">pending</text><rect x="279" y="145" width="185" height="86" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="371.5" y="181" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">已支付</text><text x="371.5" y="212" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">paid</text><rect x="527" y="145" width="183" height="86" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="618.5" y="181" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">已发货</text><text x="618.5" y="212" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">shipped</text><rect x="763" y="145" width="165" height="86" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="845.5" y="181" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">已签收</text><text x="845.5" y="212" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">delivered</text><line x1="222" y1="188" x2="278" y2="188" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="464" y1="188" x2="526" y2="188" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="710" y1="188" x2="762" y2="188" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><text x="250" y="164" font-size="16" font-weight="500" fill="#54657c" text-anchor="middle">pay</text><text x="496" y="164" font-size="16" font-weight="500" fill="#54657c" text-anchor="middle">ship</text><text x="736" y="164" font-size="16" font-weight="500" fill="#54657c" text-anchor="middle">deliver</text><rect x="59" y="312" width="189" height="85" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="153.5" y="348" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">已取消</text><text x="153.5" y="379" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">cancelled</text><rect x="293" y="312" width="185" height="85" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="385.5" y="348" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">已退款</text><text x="385.5" y="379" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">refunded</text><line x1="136" y1="232" x2="136" y2="311" stroke="#c97936" stroke-width="2.5" marker-end="url(#arr)"/><line x1="373" y1="232" x2="373" y2="311" stroke="#c97936" stroke-width="2.5" marker-end="url(#arr)"/><text x="155" y="281" font-size="16" font-weight="500" fill="#54657c" text-anchor="middle">cancel</text><text x="397" y="280" font-size="16" font-weight="500" fill="#54657c" text-anchor="middle">refund</text><text x="603" y="343" font-size="18" font-weight="600" fill="#183153" text-anchor="middle">已取消后不能直接 ship</text><text x="601" y="371" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">不存在箭头 = 不允许该状态操作</text><text x="480" y="420" font-size="16" font-weight="500" fill="#54657c" text-anchor="middle">这只是简化状态图；并发、退款失败等仍须服务端处理。</text></g></svg>
