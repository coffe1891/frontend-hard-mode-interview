<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Angular 依赖注入由 Injector 提供 Service，而不是在组件内部直接 new</title><desc id="desc">组件声明依赖，注入器根据提供者配置解析并提供服务；可以替换测试实现，减轻耦合。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6c91c1"/></marker></defs><rect x="1" y="1" width="958" height="298" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="40" y="96" width="211" height="108" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="145.5" y="127" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">订单组件</text><text x="145.5" y="155" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">声明 OrderService</text><rect x="364" y="96" width="226" height="108" rx="12" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="477" y="127" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">Injector</text><text x="477" y="155" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">解析依赖</text><rect x="708" y="96" width="211" height="108" rx="12" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="813.5" y="127" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">OrderService</text><text x="813.5" y="155" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">具体服务</text><path d="M254,151 L360,151" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M593,151 L705,151" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="310" y="131" text-anchor="middle" font-size="17" font-weight="500" fill="#263650">注入</text><text x="649" y="131" text-anchor="middle" font-size="17" font-weight="500" fill="#263650">提供</text><text x="481" y="60" text-anchor="middle" font-size="20" font-weight="600" fill="#263650">组件不必自己 new 服务，测试时可替换提供者</text><text x="480" y="268" text-anchor="middle" font-size="17" font-weight="460" fill="#627389">调用组件时，Angular 从相应注入器获取依赖。</text></g></svg>
