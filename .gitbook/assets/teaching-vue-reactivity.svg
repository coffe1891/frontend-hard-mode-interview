<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title description"><title id="title">Vue 响应式：读取时记录，修改时通知</title><desc id="description">同一个 effect 读取了 price、count，修改 title 不必重新计算总价。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L9 3 z" fill="#3778ba"/></marker></defs><rect width="960" height="450" rx="20" fill="#fff" stroke="#d9e2ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="45" font-size="27" font-weight="700" fill="#183153" text-anchor="start">Vue 响应式：读取时记录，修改时通知</text><text x="38" y="75" font-size="17" font-weight="400" fill="#54657c" text-anchor="start">同一个 effect 读取了 price、count，修改 title 不必重新计算总价。</text><line x1="38" y1="92" x2="922" y2="92" stroke="#dce5ee" stroke-width="2"/><rect x="49" y="122" width="266" height="94" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="182" y="158" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">读取数据 get()</text><text x="182" y="187" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">price、count</text><rect x="389" y="122" width="233" height="94" rx="14" fill="#f0eaff" stroke="#7658a9" stroke-width="2"/><text x="505.5" y="158" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">依赖收集 track()</text><text x="505.5" y="187" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">建立 key → effect 关系</text><rect x="692" y="122" width="222" height="94" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="803" y="158" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">依赖表</text><text x="803" y="187" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">price / count → 计算总价</text><path d="M315 168 L388 168" fill="none" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><path d="M622 168 L691 168" fill="none" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><rect x="48" y="284" width="266" height="94" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="181" y="320" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">数据修改 set()</text><text x="181" y="349" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">count 从 2 变成 3</text><rect x="387" y="284" width="236" height="94" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="505" y="320" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">触发通知 trigger()</text><text x="505" y="349" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">找到有关的 effect</text><rect x="691" y="284" width="222" height="94" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="802" y="320" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">重新计算 / 更新</text><text x="802" y="349" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">总价由 20 变 30</text><path d="M314 331 L386 331" fill="none" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><path d="M623 331 L690 331" fill="none" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><text x="480" y="417" font-size="17" font-weight="500" fill="#54657c" text-anchor="middle">没有读取 title 的计算函数，不应因为 title 改了就重复执行。</text></g></svg>
