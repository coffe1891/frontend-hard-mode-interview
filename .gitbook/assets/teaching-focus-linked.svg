<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">链表反转的一步：保存 next 后把 current.next 指向 prev</title><desc id="desc">先保存后继，再调转当前节点的箭头，否则会丢失尚未处理的链表。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="244" y="48" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">反转之前</text><text x="718" y="48" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">反转当前节点之后</text><circle cx="94" cy="149" r="29" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="94" y="156" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">1</text><circle cx="226" cy="149" r="29" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="226" y="156" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">2</text><circle cx="357" cy="149" r="29" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="357" y="156" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">3</text><text x="94" y="103" text-anchor="middle" font-size="16" font-weight="500" fill="#627389">prev</text><text x="226" y="103" text-anchor="middle" font-size="16" font-weight="500" fill="#627389">current</text><text x="357" y="103" text-anchor="middle" font-size="16" font-weight="500" fill="#627389">next</text><path d="M256 149 L325 149" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M125 149 L170 149" fill="none" stroke="#d4dce7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="177" y="183" text-anchor="middle" font-size="15" font-weight="500" fill="#aab2c4">?</text><path d="M437 150 L510 150" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="591" cy="149" r="29" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="591" y="156" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">2</text><circle cx="724" cy="149" r="29" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="724" y="156" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">1</text><circle cx="855" cy="149" r="29" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="855" y="156" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">3</text><text x="591" y="103" text-anchor="middle" font-size="16" font-weight="500" fill="#627389">current</text><text x="724" y="103" text-anchor="middle" font-size="16" font-weight="500" fill="#627389">prev</text><text x="855" y="103" text-anchor="middle" font-size="15" font-weight="500" fill="#627389">next（已保存）</text><path d="M622 149 L692 149" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="790" y="201" text-anchor="middle" font-size="16" font-weight="450" fill="#627389">3 留待下一轮处理</text><text x="482" y="262" text-anchor="middle" font-size="21" font-weight="650" fill="#517fac">关键动作：current.next = prev</text></g></svg>
