<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">垃圾回收中的根可达性：不可从根访问到的对象可以回收</title><desc id="desc">可达对象从全局变量或栈上的根引用逐层追踪；不可达对象即使互相引用，也可能被回收。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6c91c1"/></marker></defs><rect x="1" y="1" width="958" height="298" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="28" y="96" width="162" height="87" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="109" y="127" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">根引用</text><text x="109" y="155" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">全局 / 栈</text><circle cx="331" cy="96" r="25" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="331" y="103" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">A</text><circle cx="515" cy="74" r="25" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="515" y="81" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">B</text><circle cx="515" cy="160" r="25" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="515" y="167" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">C</text><path d="M191,133 L303,98" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M358,93 L487,78" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M357,109 L486,155" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="494" y="235" text-anchor="middle" font-size="18" font-weight="600" fill="#4d997e">可达对象</text><circle cx="733" cy="108" r="25" fill="#eef0f3" stroke="#b8c2cd" stroke-width="2"/><text x="733" y="115" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">D</text><circle cx="846" cy="159" r="25" fill="#eef0f3" stroke="#b8c2cd" stroke-width="2"/><text x="846" y="166" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">E</text><path d="M755,124 L825,148" fill="none" stroke="#b8c2cd" stroke-width="2.5" stroke-linecap="round"/><text x="790" y="235" text-anchor="middle" font-size="18" font-weight="600" fill="#627389">不可达 → 可回收</text><text x="479" y="279" text-anchor="middle" font-size="18" font-weight="500" fill="#627389">是否能从根到达，才是关键。</text></g></svg>
