<svg xmlns="http://www.w3.org/2000/svg" width="960" height="405" viewBox="0 0 960 405" role="img" aria-labelledby="title description"><title id="title">MVVM：界面绑定状态，减少手工同步</title><desc id="description">用户输入改变状态，派生值随状态变化，界面自动展示新结果。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L9 3 z" fill="#3778ba"/></marker></defs><rect width="960" height="405" rx="20" fill="#fff" stroke="#d9e2ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="45" font-size="27" font-weight="700" fill="#183153" text-anchor="start">MVVM：界面绑定状态，减少手工同步</text><text x="38" y="75" font-size="17" font-weight="400" fill="#54657c" text-anchor="start">用户输入改变状态，派生值随状态变化，界面自动展示新结果。</text><line x1="38" y1="92" x2="922" y2="92" stroke="#dce5ee" stroke-width="2"/><rect x="39" y="155" width="257" height="110" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="167.5" y="191" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">View（页面）</text><text x="167.5" y="222" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">输入框 / 姓名展示</text><rect x="353" y="155" width="257" height="110" rx="14" fill="#f0eaff" stroke="#7658a9" stroke-width="2"/><text x="481.5" y="191" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">ViewModel</text><text x="481.5" y="222" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">firstName / fullName</text><rect x="668" y="155" width="250" height="110" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="793" y="191" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">Model / Service</text><text x="793" y="222" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">用户数据 / 业务规则</text><line x1="296" y1="189" x2="352" y2="189" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><text x="324" y="178" font-size="15" font-weight="500" fill="#54657c" text-anchor="middle">用户输入</text><line x1="352" y1="232" x2="296" y2="232" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><text x="324" y="259" font-size="15" font-weight="500" fill="#54657c" text-anchor="middle">状态更新</text><line x1="610" y1="188" x2="667" y2="188" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="667" y1="233" x2="611" y2="233" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><text x="638" y="177" font-size="15" font-weight="500" fill="#54657c" text-anchor="middle">请求</text><text x="639" y="259" font-size="15" font-weight="500" fill="#54657c" text-anchor="middle">数据</text><rect x="352" y="305" width="260" height="65" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="481" y="331" font-size="17" font-weight="600" fill="#183153" text-anchor="middle">computed：全名 = 姓 + 名</text><text x="481" y="354" font-size="15" font-weight="400" fill="#54657c" text-anchor="middle">状态变化时重新计算</text><line x1="480" y1="304" x2="480" y2="268" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><text x="45" y="393" font-size="16" font-weight="500" fill="#54657c" text-anchor="start">关键：View 主要负责展示，ViewModel 组织“界面需要的状态”。</text></g></svg>
