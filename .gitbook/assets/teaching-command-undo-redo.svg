<svg xmlns="http://www.w3.org/2000/svg" width="960" height="405" viewBox="0 0 960 405" role="img" aria-labelledby="title description"><title id="title">命令模式：执行、撤销、重做</title><desc id="description">操作被包装成命令，历史管理器决定何时执行或撤回。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L9 3 z" fill="#3778ba"/></marker></defs><rect width="960" height="405" rx="20" fill="#fff" stroke="#d9e2ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="45" font-size="27" font-weight="700" fill="#183153" text-anchor="start">命令模式：执行、撤销、重做</text><text x="38" y="75" font-size="17" font-weight="400" fill="#54657c" text-anchor="start">操作被包装成命令，历史管理器决定何时执行或撤回。</text><line x1="38" y1="92" x2="922" y2="92" stroke="#dce5ee" stroke-width="2"/><rect x="37" y="154" width="209" height="106" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="141.5" y="190" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">初始状态</text><text x="141.5" y="221" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">value = 0</text><rect x="280" y="154" width="195" height="106" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="377.5" y="190" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">execute(+5)</text><text x="377.5" y="221" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">value = 5</text><rect x="505" y="154" width="196" height="106" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="603" y="190" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">undo()</text><text x="603" y="221" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">value = 0</text><rect x="734" y="154" width="195" height="106" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="831.5" y="190" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">redo()</text><text x="831.5" y="221" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">value = 5</text><line x1="246" y1="207" x2="279" y2="207" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="475" y1="207" x2="504" y2="207" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="701" y1="207" x2="733" y2="207" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><rect x="107" y="295" width="738" height="73" rx="14" fill="#f0eaff" stroke="#7658a9" stroke-width="2"/><text x="476" y="324" font-size="20" font-weight="700" fill="#183153" text-anchor="middle">History：done 栈 / undone 栈</text><text x="476" y="350" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">撤销把命令移入 undone；重做再移回 done</text><text x="476" y="395" font-size="16" font-weight="500" fill="#54657c" text-anchor="middle">每个命令明确提供 execute() 与 undo()；不是所有操作天然可撤销。</text></g></svg>
