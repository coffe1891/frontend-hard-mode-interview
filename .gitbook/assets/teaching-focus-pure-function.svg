<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">纯函数相同输入始终得到相同输出且不修改原始对象</title><desc id="desc">这里对照购物车计算：如果计算过程改写了原价格，第二次结果就变了；纯函数把输入视为只读数据。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="14" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="40" y="37" width="423" height="205" rx="14" fill="#fff" stroke="#d5e2ef" stroke-width="2"/><text x="249" y="75" font-size="21" font-weight="700" fill="#263650" text-anchor="middle">修改原数据的函数</text><rect x="72" y="101" width="165" height="65" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="153" y="127" font-size="18" font-weight="650" fill="#263650" text-anchor="middle">第一次</text><text x="153" y="153" font-size="22" font-weight="700" fill="#263650" text-anchor="middle">36 元</text><path d="M249 135 L291 135" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="301" y="101" width="128" height="65" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="365" y="127" font-size="18" font-weight="650" fill="#263650" text-anchor="middle">第二次</text><text x="365" y="153" font-size="22" font-weight="700" fill="#263650" text-anchor="middle">32.4 元</text><text x="250" y="219" font-size="16" font-weight="450" fill="#627389" text-anchor="middle">输入对象被上次计算改动了</text><rect x="497" y="37" width="423" height="205" rx="14" fill="#fff" stroke="#d5e2ef" stroke-width="2"/><text x="708" y="75" font-size="21" font-weight="700" fill="#263650" text-anchor="middle">纯函数 total()</text><rect x="534" y="101" width="157" height="65" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="612" y="127" font-size="18" font-weight="650" fill="#263650" text-anchor="middle">第一次</text><text x="612" y="153" font-size="22" font-weight="700" fill="#263650" text-anchor="middle">36 元</text><path d="M700 135 L742 135" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="754" y="101" width="135" height="65" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="821" y="127" font-size="18" font-weight="650" fill="#263650" text-anchor="middle">第二次</text><text x="821" y="153" font-size="22" font-weight="700" fill="#263650" text-anchor="middle">36 元</text><text x="711" y="219" font-size="16" font-weight="450" fill="#627389" text-anchor="middle">相同输入，结果不变</text><text x="479" y="276" font-size="17" font-weight="450" fill="#627389" text-anchor="middle">关键：计算总价时不要顺手修改购物车里的价格</text></g></svg>
