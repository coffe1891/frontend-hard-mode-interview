<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Vue 读取 count 时建立依赖，count 改变时只通知相关计算</title><desc id="desc">`track` 记录“谁读过 count”，`trigger` 在 count 变化时通知依赖者；这里只展示核心关系。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="61" y="71" width="255" height="161" rx="15" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="189" y="108" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">响应式数据</text><text x="189" y="153" text-anchor="middle" font-size="26" font-weight="700" fill="#263650">count：2 → 3</text><text x="189" y="202" text-anchor="middle" font-size="16" font-weight="450" fill="#627389">price = 20</text><rect x="638" y="71" width="255" height="161" rx="15" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="765" y="108" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">计算总价</text><text x="765" y="153" text-anchor="middle" font-size="29" font-weight="700" fill="#263650">40 → 60</text><text x="765" y="202" text-anchor="middle" font-size="16" font-weight="450" fill="#627389">effect / computed</text><path d="M317 110 C427 44 562 44 637 110" stroke="#9cb6df" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M638 185 C563 256 435 256 317 185" stroke="#80b7a3" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="394" y="45" width="174" height="39" rx="15" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="481" y="71" text-anchor="middle" font-size="17" font-weight="600" fill="#263650">读取时 track</text><rect x="388" y="220" width="187" height="39" rx="15" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="481" y="246" text-anchor="middle" font-size="17" font-weight="600" fill="#263650">修改时 trigger</text></g></svg>
