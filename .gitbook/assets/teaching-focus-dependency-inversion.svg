<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">结算业务依赖支付接口而非固定绑定一种支付实现</title><desc id="desc">高层业务与具体支付实现都依赖共同的抽象接口；更换支付渠道不需要重写结算业务。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="14" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="42" y="98" width="230" height="96" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="157" y="132" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">结算业务</text><text x="157" y="160" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">Checkout</text><path d="M283 145 L355 145" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="369" y="98" width="225" height="96" rx="14" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="481.5" y="132" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">支付抽象</text><text x="481.5" y="160" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">PaymentGateway</text><path d="M711 100 L589 123" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><path d="M711 197 L589 173" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="719" y="63" width="201" height="72" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="819.5" y="97" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">银行卡支付</text><text x="819.5" y="125" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">实现同一接口</text><rect x="719" y="181" width="201" height="72" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="819.5" y="215" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">模拟支付</text><text x="819.5" y="243" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">用于测试</text><text x="480" y="52" font-size="22" font-weight="650" fill="#263650" text-anchor="middle">高层模块依赖抽象，具体实现可以替换</text><text x="477" y="279" font-size="17" font-weight="450" fill="#627389" text-anchor="middle">依赖方向指向接口；选择哪个实现交给外部装配</text></g></svg>
