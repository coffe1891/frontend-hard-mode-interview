<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">同样勾选购物车，三个框架触发页面更新的入口不同</title><desc id="desc">同一项交互，React 通常调用状态更新函数，Vue 更新响应式值，Angular 更新 Signal。图仅比较入口，不代表完整内部流程。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="23" y="42" width="287" height="220" rx="15" fill="#fff" stroke="#dfe6ef" stroke-width="2"/><text x="166" y="79" text-anchor="middle" font-size="23" font-weight="700" fill="#263650">React</text><rect x="52" y="102" width="229" height="52" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="166" y="135" text-anchor="middle" font-size="19" font-weight="600" fill="#263650">setState()</text><path d="M166 155 L166 190" fill="none" stroke="#6c91c1" stroke-width="3" marker-end="url(#arr)"/><text x="166" y="220" text-anchor="middle" font-size="17" font-weight="500" fill="#627389">状态触发渲染</text><circle cx="67" cy="237" r="8" fill="#7caad8"/><rect x="337" y="42" width="287" height="220" rx="15" fill="#fff" stroke="#dfe6ef" stroke-width="2"/><text x="480" y="79" text-anchor="middle" font-size="23" font-weight="700" fill="#263650">Vue 3</text><rect x="366" y="102" width="229" height="52" rx="12" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="480" y="135" text-anchor="middle" font-size="19" font-weight="600" fill="#263650">ref.value</text><path d="M480 155 L480 190" fill="none" stroke="#6c91c1" stroke-width="3" marker-end="url(#arr)"/><text x="480" y="220" text-anchor="middle" font-size="17" font-weight="500" fill="#627389">依赖收到通知</text><circle cx="381" cy="237" r="8" fill="#6ab89c"/><rect x="651" y="42" width="287" height="220" rx="15" fill="#fff" stroke="#dfe6ef" stroke-width="2"/><text x="794" y="79" text-anchor="middle" font-size="23" font-weight="700" fill="#263650">Angular</text><rect x="680" y="102" width="229" height="52" rx="12" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="794" y="135" text-anchor="middle" font-size="19" font-weight="600" fill="#263650">signal.update()</text><path d="M794 155 L794 190" fill="none" stroke="#6c91c1" stroke-width="3" marker-end="url(#arr)"/><text x="794" y="220" text-anchor="middle" font-size="17" font-weight="500" fill="#627389">视图按机制更新</text><circle cx="695" cy="237" r="8" fill="#ab95d9"/></g></svg>
