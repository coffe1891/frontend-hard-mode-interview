<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title description"><title id="title">MVP：让 Presenter 决定界面显示什么</title><desc id="description">登录示例：View 收输入，Presenter 决策，Model / Service 处理数据。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L9 3 z" fill="#3778ba"/></marker></defs><rect width="960" height="430" rx="20" fill="#fff" stroke="#d9e2ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="45" font-size="27" font-weight="700" fill="#183153" text-anchor="start">MVP：让 Presenter 决定界面显示什么</text><text x="38" y="75" font-size="17" font-weight="400" fill="#54657c" text-anchor="start">登录示例：View 收输入，Presenter 决策，Model / Service 处理数据。</text><line x1="38" y1="92" x2="922" y2="92" stroke="#dce5ee" stroke-width="2"/><rect x="37" y="133" width="245" height="101" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="159.5" y="169" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">View</text><text x="159.5" y="200" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">输入、按钮、提示信息</text><rect x="360" y="133" width="247" height="101" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="483.5" y="169" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">Presenter</text><text x="483.5" y="200" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">加载中 / 错误 / 成功</text><rect x="677" y="133" width="242" height="101" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="798" y="169" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">Model / Service</text><text x="798" y="200" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">登录校验、用户数据</text><line x1="282" y1="173" x2="359" y2="173" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><text x="321" y="155" font-size="16" font-weight="500" fill="#54657c" text-anchor="middle">提交</text><line x1="608" y1="173" x2="676" y2="173" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><text x="644" y="155" font-size="16" font-weight="500" fill="#54657c" text-anchor="middle">请求</text><line x1="676" y1="213" x2="608" y2="213" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><text x="644" y="250" font-size="16" font-weight="500" fill="#54657c" text-anchor="middle">返回数据</text><line x1="359" y1="213" x2="283" y2="213" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><text x="320" y="250" font-size="16" font-weight="500" fill="#54657c" text-anchor="middle">驱动展示</text><rect x="345" y="308" width="278" height="84" rx="14" fill="#f0eaff" stroke="#7658a9" stroke-width="2"/><text x="484" y="344" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">单元测试</text><text x="484" y="375" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">fakeView + fakeService</text><line x1="483" y1="307" x2="483" y2="241" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><text x="45" y="408" font-size="17" font-weight="500" fill="#54657c" text-anchor="start">关键：Presenter 不直接操作 DOM，View 可由测试对象替换。</text></g></svg>
