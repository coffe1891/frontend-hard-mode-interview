<svg xmlns="http://www.w3.org/2000/svg" width="960" height="345" viewBox="0 0 960 345" role="img" aria-labelledby="title description"><title id="title">单链表反转：改变的是箭头方向</title><desc id="description">反转前 1 → 2 → 3；反转后 3 → 2 → 1。节点的值没有被倒序复制。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L9 3 z" fill="#3778ba"/></marker></defs><rect width="960" height="345" rx="20" fill="#ffffff" stroke="#d9e2ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="45" font-size="27" font-weight="700" fill="#183153" text-anchor="start">单链表反转：改变的是箭头方向</text><text x="38" y="75" font-size="17" font-weight="400" fill="#54657c" text-anchor="start">反转前 1 → 2 → 3；反转后 3 → 2 → 1。节点的值没有被倒序复制。</text><line x1="38" y1="92" x2="922" y2="92" stroke="#91a6bb" stroke-width="2" /><text x="42" y="138" font-size="21" font-weight="700" fill="#183153" text-anchor="start">原链表</text><rect x="194" y="103" width="110" height="72" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="249" y="138" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">1</text><text x="249" y="170" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">next →</text><rect x="384" y="103" width="110" height="72" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="439" y="138" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">2</text><text x="439" y="170" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">next →</text><rect x="574" y="103" width="110" height="72" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="629" y="138" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">3</text><text x="629" y="170" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">next →</text><line x1="304" y1="138" x2="380" y2="138" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="494" y1="138" x2="570" y2="138" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><text x="791" y="143" font-size="21" font-weight="600" fill="#54657c" text-anchor="middle">null</text><line x1="684" y1="138" x2="759" y2="138" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="42" y1="186" x2="912" y2="186" stroke="#91a6bb" stroke-width="2" stroke-dasharray="6 5"/><text x="42" y="238" font-size="21" font-weight="700" fill="#183153" text-anchor="start">反转后</text><rect x="194" y="207" width="110" height="72" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="249" y="242" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">3</text><text x="249" y="274" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">next →</text><rect x="384" y="207" width="110" height="72" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="439" y="242" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">2</text><text x="439" y="274" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">next →</text><rect x="574" y="207" width="110" height="72" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="629" y="242" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">1</text><text x="629" y="274" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">next →</text><line x1="304" y1="242" x2="380" y2="242" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="494" y1="242" x2="570" y2="242" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><text x="791" y="248" font-size="21" font-weight="600" fill="#54657c" text-anchor="middle">null</text><line x1="684" y1="242" x2="759" y2="242" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><text x="480" y="321" font-size="17" font-weight="500" fill="#54657c" text-anchor="middle">实现顺序：保存下一个节点 → 当前指针掉头 → 两个指针向前移动</text></g></svg>
