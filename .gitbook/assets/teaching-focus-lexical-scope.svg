<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">变量查找沿着函数定义时确定的外层作用域逐层向外</title><desc id="desc">函数里找不到变量，就向定义时的外层作用域查找；不是沿调用者的作用域查找。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="14" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="50" y="40" width="860" height="216" rx="14" fill="#f7faff" stroke="#d9e6f3" stroke-width="2"/><text x="155" y="76" font-size="22" font-weight="700" fill="#263650" text-anchor="middle">全局作用域</text><rect x="230" y="90" width="635" height="136" rx="14" fill="#fff" stroke="#b7cfeb" stroke-width="2"/><text x="338" y="122" font-size="21" font-weight="650" fill="#263650" text-anchor="middle">outer() 函数</text><rect x="488" y="142" width="326" height="65" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="651" y="167" font-size="19" font-weight="650" fill="#263650" text-anchor="middle">inner()：读取 price</text><text x="651" y="190" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">当前函数没有 price</text><rect x="260" y="156" width="165" height="47" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="343" y="186" font-size="19" font-weight="700" fill="#263650" text-anchor="middle">price = 20</text><path d="M485 173 C452 127 430 128 395 146" fill="none" stroke="#6c91c1" stroke-width="3" marker-end="url(#arr)"/><text x="478" y="276" font-size="17" font-weight="500" fill="#627389" text-anchor="middle">找到 outer() 定义的 price，得到 20</text></g></svg>
