<svg xmlns="http://www.w3.org/2000/svg" width="960" height="425" viewBox="0 0 960 425" role="img" aria-labelledby="title description"><title id="title">职责链：请求依次过关，失败就停</title><desc id="description">一个处理者只管自己的检查，通过后交给下一位。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L9 3 z" fill="#3778ba"/></marker></defs><rect width="960" height="425" rx="20" fill="#fff" stroke="#d9e2ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="45" font-size="27" font-weight="700" fill="#183153" text-anchor="start">职责链：请求依次过关，失败就停</text><text x="38" y="75" font-size="17" font-weight="400" fill="#54657c" text-anchor="start">一个处理者只管自己的检查，通过后交给下一位。</text><line x1="38" y1="92" x2="922" y2="92" stroke="#dce5ee" stroke-width="2"/><rect x="34" y="153" width="175" height="98" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="121.5" y="189" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">① 登录</text><text x="121.5" y="220" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">是否有身份？</text><rect x="273" y="153" width="175" height="98" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="360.5" y="189" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">② 地址</text><text x="360.5" y="220" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">能否送达？</text><rect x="512" y="153" width="175" height="98" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="599.5" y="189" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">③ 库存</text><text x="599.5" y="220" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">数量是否充足？</text><rect x="750" y="153" width="175" height="98" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="837.5" y="189" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">④ 风险</text><text x="837.5" y="220" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">是否需要人工审？</text><line x1="209" y1="202" x2="272" y2="202" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="448" y1="202" x2="511" y2="202" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="687" y1="202" x2="749" y2="202" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="121" y1="252" x2="121" y2="307" stroke="#c97936" stroke-width="2.5" marker-end="url(#arr)"/><line x1="361" y1="252" x2="361" y2="307" stroke="#c97936" stroke-width="2.5" marker-end="url(#arr)"/><line x1="600" y1="252" x2="600" y2="307" stroke="#c97936" stroke-width="2.5" marker-end="url(#arr)"/><line x1="838" y1="252" x2="838" y2="307" stroke="#c97936" stroke-width="2.5" marker-end="url(#arr)"/><rect x="47" y="314" width="148" height="57" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="121" y="348" font-size="17" font-weight="700" fill="#183153" text-anchor="middle">失败：终止</text><rect x="287" y="314" width="148" height="57" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="361" y="348" font-size="17" font-weight="700" fill="#183153" text-anchor="middle">失败：终止</text><rect x="526" y="314" width="148" height="57" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="600" y="348" font-size="17" font-weight="700" fill="#183153" text-anchor="middle">失败：终止</text><rect x="764" y="314" width="148" height="57" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="838" y="348" font-size="17" font-weight="700" fill="#183153" text-anchor="middle">失败：终止</text><text x="476" y="405" font-size="17" font-weight="500" fill="#54657c" text-anchor="middle">全都通过 → 执行后续流程；错误时返回原因，避免无效工作继续向后传。</text></g></svg>
