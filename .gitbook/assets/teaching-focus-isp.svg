<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">只打印文档的设备不必被迫实现扫描和传真接口</title><desc id="desc">小型打印机只需要 `print()`；拆分接口后，不必为了遵守一份庞大接口而空实现 `scan()`、`fax()`。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce5ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="35" y="30" width="431" height="221" rx="14" fill="#fff" stroke="#dbe5ef" stroke-width="2"/><text x="251" y="64" text-anchor="middle" font-size="21" font-weight="700" fill="#263650">大接口：被迫实现</text><rect x="69" y="90" width="169" height="112" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="153.5" y="124" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">设备接口</text><text x="153.5" y="152" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">打印 / 扫描 / 传真</text><path d="M246 146 L295 146" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="307" y="90" width="131" height="112" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="372.5" y="124" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">小打印机</text><text x="372.5" y="152" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">只会打印</text><text x="251" y="231" text-anchor="middle" font-size="15" font-weight="450" fill="#61748b">多余方法只能报错或空实现</text><rect x="495" y="30" width="430" height="221" rx="14" fill="#fff" stroke="#dbe5ef" stroke-width="2"/><text x="707" y="64" text-anchor="middle" font-size="21" font-weight="700" fill="#263650">拆成小接口：按需依赖</text><rect x="521" y="90" width="178" height="112" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="610" y="124" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">Print</text><text x="610" y="152" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">print()</text><path d="M711 146 L754 146" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="766" y="90" width="132" height="112" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="832" y="124" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">小打印机</text><text x="832" y="152" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">print()</text><text x="708" y="231" text-anchor="middle" font-size="15" font-weight="450" fill="#61748b">Scan / Fax 独立，按需组合</text><text x="480" y="278" text-anchor="middle" font-size="18" font-weight="500" fill="#61748b">客户端不应该被迫依赖用不到的方法</text></g></svg>
