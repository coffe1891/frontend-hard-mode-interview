<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">TypeScript 接口定义 area 方法契约，不同形状都能作为 Shape 使用</title><desc id="desc">接口定义对象必须提供的能力；Circle、Rectangle 实现 `area()` 后，都可以传给接收 `Shape` 的函数。接口主要用于编译期检查。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce5ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="324" y="31" width="318" height="85" rx="14" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="483" y="65" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">interface Shape</text><text x="483" y="93" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">area(): number</text><path d="M383 121 L258 159" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M585 121 L697 159" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="66" y="166" width="352" height="72" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="242" y="200" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">Circle</text><text x="242" y="228" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">实现 area()</text><rect x="548" y="166" width="352" height="72" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="724" y="200" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">Rectangle</text><text x="724" y="228" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">实现 area()</text><text x="483" y="270" text-anchor="middle" font-size="17" font-weight="500" fill="#61748b">调用方只依赖 Shape，接口类型不会作为 JS 类留在运行时</text></g></svg>
