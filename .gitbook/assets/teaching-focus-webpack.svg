<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Webpack 的 report 代码块直到点击报表页面才按需加载</title><desc id="desc">首页先加载主代码；进入报表页时才请求动态导入生成的报表代码块。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="68" y="38" width="305" height="218" rx="15" fill="#fff" stroke="#b4c6dd" stroke-width="2"/><rect x="69" y="38" width="304" height="37" rx="13" fill="#e8eef7" stroke="#b4c6dd" stroke-width="2"/><text x="220" y="63" text-anchor="middle" font-size="18" font-weight="650" fill="#263650">首页</text><rect x="102" y="105" width="229" height="60" rx="15" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="216" y="143" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">main.js 已加载</text><rect x="102" y="190" width="229" height="43" rx="12" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="216" y="219" text-anchor="middle" font-size="17" font-weight="600" fill="#263650">查看报表 →</text><path d="M375 151 L560 151" fill="none" stroke="#6c91c1" stroke-width="3" marker-end="url(#arr)"/><rect x="400" y="109" width="136" height="82" rx="13" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="468" y="143" text-anchor="middle" font-size="17" font-weight="650" fill="#263650">import()</text><text x="468" y="169" text-anchor="middle" font-size="14" font-weight="450" fill="#627389">用户点击后</text><rect x="583" y="38" width="304" height="218" rx="15" fill="#fff" stroke="#b4c6dd" stroke-width="2"/><rect x="584" y="38" width="303" height="37" rx="13" fill="#e8eef7" stroke="#b4c6dd" stroke-width="2"/><text x="735" y="63" text-anchor="middle" font-size="18" font-weight="650" fill="#263650">报表页</text><rect x="615" y="103" width="240" height="49" rx="12" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="735" y="133" text-anchor="middle" font-size="18" font-weight="650" fill="#263650">report.chunk.js</text><rect x="643" y="207" width="27" height="19" rx="4" fill="#a7bce7" stroke="#a7bce7" stroke-width="2"/><rect x="691" y="195" width="27" height="31" rx="4" fill="#a7bce7" stroke="#a7bce7" stroke-width="2"/><rect x="739" y="183" width="27" height="43" rx="4" fill="#a7bce7" stroke="#a7bce7" stroke-width="2"/><rect x="787" y="171" width="27" height="55" rx="4" fill="#a7bce7" stroke="#a7bce7" stroke-width="2"/><text x="478" y="284" text-anchor="middle" font-size="17" font-weight="450" fill="#627389">首页不必提前下载只在报表页使用的代码。</text></g></svg>
