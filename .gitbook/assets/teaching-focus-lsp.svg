<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">处理 Shape 的代码不需要知道它是矩形、正方形还是圆形，只需读取有效面积</title><desc id="desc">如果子类保持父类承诺的行为，调用方可以统一读取 `area`，换不同形状也不必改调用逻辑；重点是行为契约，不只是继承语法。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce5ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="35" y="99" width="242" height="93" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="156" y="133" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">调用方</text><text x="156" y="161" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">读取 shape.area</text><path d="M288 145 L371 145" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="381" y="90" width="231" height="110" rx="14" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="496.5" y="124" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">Shape 契约</text><text x="496.5" y="152" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">area 为有效面积</text><path d="M624 145 L688 68" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M624 145 L688 145" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M624 145 L688 224" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="705" y="35" width="216" height="64" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="813" y="74" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">矩形</text><rect x="705" y="114" width="216" height="64" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="813" y="153" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">正方形</text><rect x="705" y="193" width="216" height="64" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="813" y="232" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">圆形</text><text x="480" y="273" text-anchor="middle" font-size="17" font-weight="500" fill="#61748b">可以替换的前提是行为符合约定，不是“子类能继承”就够了</text></g></svg>
