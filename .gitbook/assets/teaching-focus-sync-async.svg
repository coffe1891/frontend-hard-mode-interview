<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">同步异步表示谁获取结果，阻塞非阻塞表示等待时线程能否继续工作</title><desc id="desc">同步/异步关注结果怎样送达；阻塞/非阻塞关注等待期间线程是否还能做事。两组概念不是同一回事。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="14" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="32" y="32" width="438" height="222" rx="14" fill="#fff" stroke="#dbe5f1" stroke-width="2"/><text x="251" y="73" font-size="22" font-weight="700" fill="#263650" text-anchor="middle">结果怎么拿？</text><rect x="65" y="111" width="163" height="74" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="146" y="140" font-size="20" font-weight="700" fill="#263650" text-anchor="middle">同步</text><text x="146" y="165" font-size="16" font-weight="450" fill="#263650" text-anchor="middle">自己取 / 查询</text><rect x="273" y="111" width="163" height="74" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="354" y="140" font-size="20" font-weight="700" fill="#263650" text-anchor="middle">异步</text><text x="354" y="165" font-size="16" font-weight="450" fill="#263650" text-anchor="middle">收到结果通知</text><rect x="490" y="32" width="438" height="222" rx="14" fill="#fff" stroke="#dbe5f1" stroke-width="2"/><text x="709" y="73" font-size="22" font-weight="700" fill="#263650" text-anchor="middle">等待时线程能做什么？</text><rect x="524" y="111" width="168" height="74" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="609" y="140" font-size="20" font-weight="700" fill="#263650" text-anchor="middle">阻塞</text><text x="609" y="165" font-size="16" font-weight="450" fill="#263650" text-anchor="middle">不能继续执行</text><rect x="735" y="111" width="168" height="74" rx="14" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="819" y="140" font-size="20" font-weight="700" fill="#263650" text-anchor="middle">非阻塞</text><text x="819" y="165" font-size="16" font-weight="450" fill="#263650" text-anchor="middle">可继续做别的</text><text x="480" y="280" font-size="17" font-weight="500" fill="#627389" text-anchor="middle">两组维度可以组合，不能简单画等号</text></g></svg>
