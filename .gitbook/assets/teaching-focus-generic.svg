<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">泛型函数 first&lt;T&gt; 的参数类型决定返回值类型</title><desc id="desc">同一个 first&lt;T&gt; 可接收不同元素类型；返回值在静态类型层面跟随输入元素类型，并保留 undefined 的可能性。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6c91c1"/></marker></defs><rect x="1" y="1" width="958" height="298" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="40" y="50" width="267" height="63" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="173" y="89" text-anchor="middle" font-size="20" font-weight="550" fill="#263650">[10, 20, 30]</text><path d="M309,82 L344,82" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="353" y="50" width="238" height="63" rx="12" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="472" y="89" text-anchor="middle" font-size="21" font-weight="650" fill="#263650">first&lt;T&gt;()</text><path d="M594,82 L638,82" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="648" y="50" width="275" height="63" rx="12" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="785" y="89" text-anchor="middle" font-size="19" font-weight="600" fill="#263650">number | undefined</text><rect x="40" y="153" width="267" height="63" rx="12" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="173" y="192" text-anchor="middle" font-size="20" font-weight="550" fill="#263650">['张三','李四']</text><path d="M309,185 L344,185" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="353" y="153" width="238" height="63" rx="12" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="472" y="192" text-anchor="middle" font-size="21" font-weight="650" fill="#263650">first&lt;T&gt;()</text><path d="M594,185 L638,185" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="648" y="153" width="275" height="63" rx="12" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="785" y="192" text-anchor="middle" font-size="19" font-weight="600" fill="#263650">string | undefined</text><text x="480" y="48" text-anchor="middle" font-size="20" font-weight="600" fill="#263650">T 由输入推断，输出类型也随之改变</text><text x="480" y="281" text-anchor="middle" font-size="17" font-weight="450" fill="#627389">并非 any：编译器仍能检查返回值类型。</text></g></svg>
