<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Node.js：等待 I/O 时，为什么还能做别的事？</title><desc id="description">主线程不必傻等网络和文件读写；但同步死循环真的会把程序卡住。</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#fff"/></linearGradient><linearGradient id="blue"><stop stop-color="#1672df"/><stop offset="1" stop-color="#49a1ff"/></linearGradient><linearGradient id="green"><stop stop-color="#0a9466"/><stop offset="1" stop-color="#34c992"/></linearGradient><linearGradient id="purple"><stop stop-color="#794bd1"/><stop offset="1" stop-color="#b58efa"/></linearGradient><linearGradient id="orange"><stop stop-color="#ef8d25"/><stop offset="1" stop-color="#ffb94c"/></linearGradient><filter id="shadow" x="-20%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#253859" flood-opacity=".14"/></filter><marker id="arr" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#4279c9"/></marker></defs><rect width="1200" height="760" fill="url(#bg)"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="27" y="24" width="1146" height="95" rx="24" fill="#fff" stroke="none" stroke-width="0"/><text x="600" y="75" text-anchor="middle" fill="#142f57" font-size="40" font-weight="800">Node.js：等待 I/O 时，为什么还能做别的事？</text><text x="600" y="107" text-anchor="middle" fill="#62718c" font-size="17" font-weight="450">主线程不必傻等网络和文件读写；但同步死循环真的会把程序卡住。</text><g filter="url(#shadow)"><rect x="28" y="156" width="228" height="329" rx="24" fill="#e2efff" stroke="none" stroke-width="0"/></g><rect x="49" y="174" width="190" height="46" rx="15" fill="url(#blue)" stroke="none" stroke-width="0"/><text x="143" y="205" text-anchor="middle" fill="#fff" font-size="24" font-weight="750">客户端请求</text><rect x="49" y="249" width="187" height="61" rx="12" fill="#fff" stroke="#b9d6f9" stroke-width="2"/><circle cx="72" cy="277" r="13" fill="#49a1ff" stroke="#fff" stroke-width="2"/><text x="95" y="274" text-anchor="start" fill="#263c59" font-size="18" font-weight="700">查询用户</text><text x="95" y="294" text-anchor="start" fill="#64748d" font-size="13" font-weight="500">GET /api/user</text><rect x="49" y="323" width="187" height="61" rx="12" fill="#fff" stroke="#b9d6f9" stroke-width="2"/><circle cx="72" cy="351" r="13" fill="#c189fa" stroke="#fff" stroke-width="2"/><text x="95" y="348" text-anchor="start" fill="#263c59" font-size="18" font-weight="700">读取文件</text><text x="95" y="368" text-anchor="start" fill="#64748d" font-size="13" font-weight="500">GET /file/report</text><rect x="49" y="397" width="187" height="61" rx="12" fill="#fff" stroke="#b9d6f9" stroke-width="2"/><circle cx="72" cy="425" r="13" fill="#38c18f" stroke="#fff" stroke-width="2"/><text x="95" y="422" text-anchor="start" fill="#263c59" font-size="18" font-weight="700">获取图片</text><text x="95" y="442" text-anchor="start" fill="#64748d" font-size="13" font-weight="500">GET /api/image</text><g filter="url(#shadow)"><rect x="298" y="165" width="309" height="292" rx="24" fill="#e9e4ff" stroke="none" stroke-width="0"/></g><rect x="312" y="181" width="281" height="45" rx="16" fill="url(#purple)" stroke="none" stroke-width="0"/><text x="453" y="212" text-anchor="middle" fill="#fff" font-size="24" font-weight="750">JavaScript 主线程</text><g transform="translate(360 257) scale(1.1)"><rect x="0" y="0" width="173" height="105" rx="12" fill="#263958" stroke="none" stroke-width="0"/><rect x="9" y="9" width="155" height="87" rx="7" fill="#15243b" stroke="none" stroke-width="0"/><text x="25" y="40" text-anchor="start" fill="#70f3bf" font-size="27" font-weight="800">&gt;_</text><rect x="25" y="51" width="88" height="5" rx="2" fill="#8ca6d5" stroke="none" stroke-width="0"/><rect x="25" y="65" width="119" height="5" rx="2" fill="#5884d3" stroke="none" stroke-width="0"/><path d="M-21 109 L194 109 L173 125 L0 125 Z" fill="#6d8ca8"/><rect x="64" y="112" width="43" height="5" rx="2" fill="#b8d4e8" stroke="none" stroke-width="0"/></g><text x="453" y="426" text-anchor="middle" fill="#4f567a" font-size="17" font-weight="500">发起 I/O 后继续处理别的任务</text><g filter="url(#shadow)"><rect x="690" y="158" width="469" height="300" rx="24" fill="#dcf7e9" stroke="none" stroke-width="0"/></g><rect x="714" y="174" width="421" height="45" rx="16" fill="url(#green)" stroke="none" stroke-width="0"/><text x="922" y="205" text-anchor="middle" fill="#fff" font-size="24" font-weight="750">运行时 / 操作系统</text><rect x="718" y="240" width="195" height="164" rx="17" fill="#fff" stroke="none" stroke-width="0"/><rect x="933" y="240" width="201" height="164" rx="17" fill="#fff" stroke="none" stroke-width="0"/><circle cx="815" cy="306" r="41" fill="#c7edff" stroke="#4d99d2" stroke-width="4"/><circle cx="790" cy="314" r="28" fill="#c7edff" stroke="none" stroke-width="2"/><circle cx="841" cy="315" r="26" fill="#c7edff" stroke="none" stroke-width="2"/><text x="815" y="378" text-anchor="middle" fill="#193254" font-size="22" font-weight="600">网络 I/O</text><path d="M979 288 h96 l22 20 v66 h-118 Z" fill="#f6c261" stroke="#bd7c21" stroke-width="4"/><rect x="990" y="277" width="83" height="25" rx="5" fill="#ffe5a8" stroke="none" stroke-width="0"/><text x="1035" y="382" text-anchor="middle" fill="#193254" font-size="22" font-weight="600">文件 I/O</text><path d="M256 316 L297 316" stroke="#4279c9" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><path d="M608 310 L689 310" stroke="#4279c9" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><text x="638" y="285" text-anchor="middle" fill="#62718c" font-size="16" font-weight="550">交给底层</text><g filter="url(#shadow)"><rect x="729" y="503" width="429" height="136" rx="24" fill="#efe6ff" stroke="none" stroke-width="0"/></g><rect x="744" y="515" width="401" height="40" rx="14" fill="url(#purple)" stroke="none" stroke-width="0"/><text x="944" y="543" text-anchor="middle" fill="#fff" font-size="23" font-weight="720">回调队列：等待执行</text><rect x="758" y="567" width="116" height="53" rx="12" fill="#ddedff" stroke="none" stroke-width="0"/><text x="816" y="602" text-anchor="middle" fill="#193254" font-size="18" font-weight="600">用户数据</text><rect x="885" y="567" width="116" height="53" rx="12" fill="#f3ebff" stroke="none" stroke-width="0"/><text x="943" y="602" text-anchor="middle" fill="#193254" font-size="18" font-weight="600">文件结果</text><rect x="1012" y="567" width="116" height="53" rx="12" fill="#dcf7e9" stroke="none" stroke-width="0"/><text x="1070" y="602" text-anchor="middle" fill="#193254" font-size="18" font-weight="600">图片结果</text><path d="M1063 461 V501" stroke="#db8b39" stroke-width="8" fill="none" marker-end="url(#arr)"/><path d="M724 581 L621 581" stroke="#6a78ca" stroke-width="8" fill="none" marker-end="url(#arr)"/><circle cx="497" cy="569" r="93" fill="#e4e2ff" stroke="#8564d4" stroke-width="7"/><text x="497" y="565" text-anchor="middle" fill="#3a327c" font-size="25" font-weight="750">事件循环</text><text x="497" y="599" text-anchor="middle" fill="#6b5aaf" font-size="18" font-weight="550">Event Loop</text><path d="M449 500 A86 86 0 0 1 570 551" fill="none" stroke="#52bba8" stroke-width="8" marker-end="url(#arr)"/><g filter="url(#shadow)"><rect x="55" y="515" width="304" height="132" rx="24" fill="#e3f5ed" stroke="none" stroke-width="0"/></g><text x="207" y="551" text-anchor="middle" fill="#1b7858" font-size="20" font-weight="730">回到主线程执行回调</text><text x="207" y="584" text-anchor="middle" fill="#4d6e6a" font-size="17" font-weight="500">网络结果、文件结果……</text><text x="207" y="610" text-anchor="middle" fill="#4d6e6a" font-size="17" font-weight="500">继续响应后续请求</text><path d="M402 590 L360 590" stroke="#4279c9" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="55" y="665" width="1102" height="68" rx="20" fill="#fff0ec" stroke="#ed9a80" stroke-width="2"/><text x="98" y="706" text-anchor="middle" fill="#c64c37" font-size="38" font-weight="600">⚠</text><text x="612" y="707" text-anchor="middle" fill="#ae4536" font-size="23" font-weight="710">同步死循环会阻塞主线程；异步等待不等于 CPU 计算自动变快。</text></g></svg>
