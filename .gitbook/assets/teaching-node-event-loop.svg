<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title description"><title id="title">Node.js：等待 I/O 时为什么还能做别的事？</title><desc id="description">JavaScript 主线程执行回调，异步等待通常交给运行时或操作系统。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L9 3 z" fill="#3778ba"/></marker></defs><rect width="960" height="440" rx="20" fill="#ffffff" stroke="#d9e2ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="45" font-size="27" font-weight="700" fill="#183153" text-anchor="start">Node.js：等待 I/O 时为什么还能做别的事？</text><text x="38" y="75" font-size="17" font-weight="400" fill="#54657c" text-anchor="start">JavaScript 主线程执行回调，异步等待通常交给运行时或操作系统。</text><line x1="38" y1="92" x2="922" y2="92" stroke="#91a6bb" stroke-width="2" /><rect x="38" y="141" width="175" height="83" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="125.5" y="176" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">HTTP 请求</text><text x="125.5" y="208" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">请求 A / B / C</text><rect x="295" y="126" width="259" height="108" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="424.5" y="161" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">JS 主线程 / 事件循环</text><text x="424.5" y="193" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">执行当前任务与回调</text><rect x="650" y="122" width="267" height="100" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="783.5" y="157" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">运行时 / 操作系统</text><text x="783.5" y="189" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">网络 I/O、部分线程池任务</text><line x1="213" y1="181" x2="294" y2="181" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="555" y1="173" x2="649" y2="173" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><rect x="651" y="301" width="265" height="75" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="783.5" y="336" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">I/O 完成</text><text x="783.5" y="368" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">回调变为可执行任务</text><rect x="297" y="298" width="259" height="83" rx="14" fill="#f0eaff" stroke="#7658a9" stroke-width="2"/><text x="426.5" y="333" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">排队等待执行</text><text x="426.5" y="365" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">按运行时调度规则执行</text><line x1="783" y1="222" x2="783" y2="300" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><line x1="650" y1="338" x2="556" y2="338" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><path d="M420 298 L420 240" fill="none" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><rect x="42" y="291" width="182" height="80" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="133" y="327" font-size="19" font-weight="700" fill="#183153" text-anchor="middle">同步死循环</text><text x="133" y="354" font-size="16" font-weight="500" fill="#54657c" text-anchor="middle">会阻塞主线程</text><text x="42" y="411" font-size="16" font-weight="500" fill="#54657c" text-anchor="start">关键：async 关键字不会把 CPU 密集型计算自动移到另一个线程。</text></g></svg>
