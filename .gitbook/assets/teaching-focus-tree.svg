<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">二叉树前序遍历先访问根节点，再遍历左子树，最后遍历右子树</title><desc id="desc">只演示前序遍历（根→左→右），其余三种遍历方法可结合正文同一棵树理解。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><path d="M245 73 L151 146" fill="none" stroke="#a4b5c9" stroke-width="3" stroke-linecap="round"/><path d="M245 73 L355 146" fill="none" stroke="#a4b5c9" stroke-width="3" stroke-linecap="round"/><path d="M151 164 L88 238" fill="none" stroke="#a4b5c9" stroke-width="3" stroke-linecap="round"/><path d="M151 164 L214 238" fill="none" stroke="#a4b5c9" stroke-width="3" stroke-linecap="round"/><circle cx="245" cy="64" r="29" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="245" y="71" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">1</text><circle cx="151" cy="155" r="29" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="151" y="162" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">2</text><circle cx="355" cy="155" r="29" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="355" y="162" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">3</text><circle cx="88" cy="240" r="29" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="88" y="247" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">4</text><circle cx="214" cy="240" r="29" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="214" y="247" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">5</text><text x="670" y="75" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">前序：先根，再左，最后右</text><circle cx="542" cy="146" r="25" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="542" y="153" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">1</text><circle cx="631" cy="146" r="25" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="631" y="153" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">2</text><circle cx="720" cy="146" r="25" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="720" y="153" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">4</text><circle cx="809" cy="146" r="25" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="809" y="153" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">5</text><circle cx="898" cy="146" r="25" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="898" y="153" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">3</text><path d="M570 146 L601 146" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M659 146 L690 146" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M748 146 L779 146" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M837 146 L868 146" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="718" y="236" text-anchor="middle" font-size="18" font-weight="500" fill="#627389">访问顺序：1 → 2 → 4 → 5 → 3</text></g></svg>
