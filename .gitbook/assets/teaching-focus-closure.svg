<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">内层函数读取外层变量，即使调用发生在外层函数返回之后</title><desc id="desc">闭包保留对外层变量的访问能力；外层函数返回，不代表被引用的变量立即消失。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="14" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="55" y="79" width="305" height="112" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="207.5" y="112" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">func() 内部</text><text x="207.5" y="140" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">a = “coffe”</text><path d="M362 136 L481 136" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="492" y="79" width="296" height="112" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="640" y="112" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">返回的 func1()</text><text x="640" y="140" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">console.log(a)</text><path d="M797 136 L889 136" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="856" y="98" width="77" height="77" rx="12" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="895" y="141" font-size="25" font-weight="700" fill="#263650" text-anchor="middle">a</text><text x="208" y="65" font-size="16" font-weight="500" fill="#627389" text-anchor="middle">定义外层变量</text><text x="638" y="65" font-size="16" font-weight="500" fill="#627389" text-anchor="middle">延后调用内层函数</text><rect x="245" y="223" width="476" height="42" rx="10" fill="#f4f7fc" stroke="#dce7f3" stroke-width="2"/><text x="483" y="251" font-size="18" font-weight="550" fill="#263650" text-anchor="middle">func() 已返回，a 仍被 func1 引用</text></g></svg>
