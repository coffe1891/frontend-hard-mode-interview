<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title description"><title id="title">为什么“每次拿最大面额”会输？</title><desc id="description">零钱面额为 1、3、4 元，目标找零 6 元。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L9 3 z" fill="#3778ba"/></marker></defs><rect width="960" height="370" rx="20" fill="#ffffff" stroke="#d9e2ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="45" font-size="27" font-weight="700" fill="#183153" text-anchor="start">为什么“每次拿最大面额”会输？</text><text x="38" y="75" font-size="17" font-weight="400" fill="#54657c" text-anchor="start">零钱面额为 1、3、4 元，目标找零 6 元。</text><line x1="38" y1="92" x2="922" y2="92" stroke="#91a6bb" stroke-width="2" /><rect x="43" y="127" width="394" height="176" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="240" y="162" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">贪心：先拿最大的</text><text x="240" y="194" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">4 + 1 + 1 = 6（3 枚）</text><rect x="521" y="127" width="394" height="176" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="718" y="162" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">动态规划：比较所有可达方案</text><text x="718" y="194" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">3 + 3 = 6（2 枚）</text><circle cx="127" cy="257" r="25" fill="#ffe0c2" stroke="#c97936" stroke-width="2"/><text x="127" y="264" font-size="23" font-weight="700" fill="#183153" text-anchor="middle">4</text><circle cx="236" cy="257" r="25" fill="#ffe0c2" stroke="#c97936" stroke-width="2"/><text x="236" y="264" font-size="23" font-weight="700" fill="#183153" text-anchor="middle">1</text><circle cx="345" cy="257" r="25" fill="#ffe0c2" stroke="#c97936" stroke-width="2"/><text x="345" y="264" font-size="23" font-weight="700" fill="#183153" text-anchor="middle">1</text><circle cx="665" cy="257" r="25" fill="#d9f3e4" stroke="#248260" stroke-width="2"/><text x="665" y="264" font-size="23" font-weight="700" fill="#183153" text-anchor="middle">3</text><circle cx="777" cy="257" r="25" fill="#d9f3e4" stroke="#248260" stroke-width="2"/><text x="777" y="264" font-size="23" font-weight="700" fill="#183153" text-anchor="middle">3</text><text x="480" y="339" font-size="19" font-weight="600" fill="#183153" text-anchor="middle">局部最优 ≠ 全局最优；贪心算法需要证明，而不是只凭直觉。</text></g></svg>
