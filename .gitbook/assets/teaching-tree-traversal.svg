<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc"><title id="title">同一棵二叉树，为什么能遍历出四种答案？</title><desc id="desc">同一个 1-2-3-4-5 结构，访问节点的先后顺序完全不同。</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f4ff"/><stop offset="1" stop-color="#fff"/></linearGradient><linearGradient id="blue"><stop stop-color="#165abf"/><stop offset="1" stop-color="#2ea4fc"/></linearGradient><linearGradient id="green"><stop stop-color="#0b8058"/><stop offset="1" stop-color="#3ac897"/></linearGradient><linearGradient id="red"><stop stop-color="#b42e58"/><stop offset="1" stop-color="#f15d80"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="150%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#253859" flood-opacity=".15"/></filter><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#3670c9"/></marker></defs><rect x="0" y="0" width="1200" height="870" fill="url(#b)"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="23" y="22" width="1154" height="98" rx="24" fill="#fff" stroke="none" stroke-width="0"/><text x="600" y="75" fill="#19304f" font-size="41" font-weight="800" text-anchor="middle">同一棵二叉树，为什么能遍历出四种答案？</text><text x="600" y="106" fill="#586c83" font-size="17" font-weight="460" text-anchor="middle">同一个 1-2-3-4-5 结构，访问节点的先后顺序完全不同。</text><g filter="url(#sh)"><rect x="28" y="179" width="352" height="200" rx="22" fill="#ffe6ef" stroke="none" stroke-width="0"/></g><rect x="43" y="194" width="322" height="52" rx="16" fill="#fff" stroke="none" stroke-width="0"/><text x="204" y="228" fill="#223452" font-size="25" font-weight="750" text-anchor="middle">前序：根 → 左 → 右</text><rect x="49" y="261" width="310" height="61" rx="14" fill="#fff" stroke="none" stroke-width="0"/><text x="204" y="303" fill="#1d3a58" font-size="24" font-weight="760" text-anchor="middle">1 → 2 → 4 → 5 → 3</text><text x="204" y="348" fill="#526985" font-size="17" font-weight="550" text-anchor="middle">先看自己，再走左、右分支</text><g filter="url(#sh)"><rect x="821" y="179" width="351" height="200" rx="22" fill="#e4efff" stroke="none" stroke-width="0"/></g><rect x="836" y="194" width="321" height="52" rx="16" fill="#fff" stroke="none" stroke-width="0"/><text x="996.5" y="228" fill="#223452" font-size="25" font-weight="750" text-anchor="middle">中序：左 → 根 → 右</text><rect x="842" y="261" width="309" height="61" rx="14" fill="#fff" stroke="none" stroke-width="0"/><text x="996.5" y="303" fill="#1d3a58" font-size="24" font-weight="760" text-anchor="middle">4 → 2 → 5 → 1 → 3</text><text x="996.5" y="348" fill="#526985" font-size="17" font-weight="550" text-anchor="middle">先走左边，再看自己</text><g filter="url(#sh)"><rect x="28" y="450" width="352" height="200" rx="22" fill="#eee3ff" stroke="none" stroke-width="0"/></g><rect x="43" y="465" width="322" height="52" rx="16" fill="#fff" stroke="none" stroke-width="0"/><text x="204" y="499" fill="#223452" font-size="25" font-weight="750" text-anchor="middle">后序：左 → 右 → 根</text><rect x="49" y="532" width="310" height="61" rx="14" fill="#fff" stroke="none" stroke-width="0"/><text x="204" y="574" fill="#1d3a58" font-size="24" font-weight="760" text-anchor="middle">4 → 5 → 2 → 3 → 1</text><text x="204" y="619" fill="#526985" font-size="17" font-weight="550" text-anchor="middle">先处理孩子，最后才处理自己</text><g filter="url(#sh)"><rect x="821" y="450" width="351" height="200" rx="22" fill="#fff0d6" stroke="none" stroke-width="0"/></g><rect x="836" y="465" width="321" height="52" rx="16" fill="#fff" stroke="none" stroke-width="0"/><text x="996.5" y="499" fill="#223452" font-size="25" font-weight="750" text-anchor="middle">层序：按层访问</text><rect x="842" y="532" width="309" height="61" rx="14" fill="#fff" stroke="none" stroke-width="0"/><text x="996.5" y="574" fill="#1d3a58" font-size="24" font-weight="760" text-anchor="middle">1 → 2 → 3 → 4 → 5</text><text x="996.5" y="619" fill="#526985" font-size="17" font-weight="550" text-anchor="middle">先看第一层，再看第二层</text><path d="M557 685 C542 623 550 548 540 492 L663 493 C651 563 648 641 642 685 Z" fill="#be7744" stroke="#90502a" stroke-width="5"/><circle cx="512" cy="385" r="115" fill="#a9e48b" stroke="#66b45e" stroke-width="5"/><circle cx="616" cy="365" r="133" fill="#a9e48b" stroke="#66b45e" stroke-width="5"/><circle cx="685" cy="395" r="101" fill="#a9e48b" stroke="#66b45e" stroke-width="5"/><circle cx="558" cy="297" r="111" fill="#a9e48b" stroke="#66b45e" stroke-width="5"/><circle cx="638" cy="288" r="125" fill="#a9e48b" stroke="#66b45e" stroke-width="5"/><circle cx="485" cy="457" r="90" fill="#a9e48b" stroke="#66b45e" stroke-width="5"/><circle cx="737" cy="455" r="78" fill="#a9e48b" stroke="#66b45e" stroke-width="5"/><circle cx="526" cy="355" r="89" fill="#7ccf69" stroke="#59ad57" stroke-width="5"/><circle cx="644" cy="357" r="96" fill="#7ccf69" stroke="#59ad57" stroke-width="5"/><circle cx="581" cy="285" r="100" fill="#7ccf69" stroke="#59ad57" stroke-width="5"/><g stroke="#77502e" stroke-width="10" stroke-linecap="round" fill="none"><path d="M602 245 L521 364 M602 245 L689 364 M521 364 L457 476 M521 364 L584 476"/></g><circle cx="602" cy="245" r="39" fill="#ffdf75" stroke="#66442e" stroke-width="5"/><circle opacity=".35" cx="591" cy="232" r="10" fill="#fff" stroke="none" stroke-width="0"/><text x="602" y="258" fill="#1b293d" font-size="42" font-weight="850" text-anchor="middle">1</text><circle cx="521" cy="364" r="39" fill="#bbdbff" stroke="#66442e" stroke-width="5"/><circle opacity=".35" cx="510" cy="351" r="10" fill="#fff" stroke="none" stroke-width="0"/><text x="521" y="377" fill="#1b293d" font-size="42" font-weight="850" text-anchor="middle">2</text><circle cx="689" cy="364" r="39" fill="#bbdbff" stroke="#66442e" stroke-width="5"/><circle opacity=".35" cx="678" cy="351" r="10" fill="#fff" stroke="none" stroke-width="0"/><text x="689" y="377" fill="#1b293d" font-size="42" font-weight="850" text-anchor="middle">3</text><circle cx="457" cy="476" r="39" fill="#ffd1dc" stroke="#66442e" stroke-width="5"/><circle opacity=".35" cx="446" cy="463" r="10" fill="#fff" stroke="none" stroke-width="0"/><text x="457" y="489" fill="#1b293d" font-size="42" font-weight="850" text-anchor="middle">4</text><circle cx="584" cy="476" r="39" fill="#ffd1dc" stroke="#66442e" stroke-width="5"/><circle opacity=".35" cx="573" cy="463" r="10" fill="#fff" stroke="none" stroke-width="0"/><text x="584" y="489" fill="#1b293d" font-size="42" font-weight="850" text-anchor="middle">5</text><rect x="465" y="557" width="282" height="59" rx="23" fill="#fff" stroke="#5baa66" stroke-width="3"/><text x="606" y="594" fill="#347845" font-size="24" font-weight="780" text-anchor="middle">根节点是 1</text><path d="M420 686 Q603 633 800 686 L800 735 Q599 754 420 735 Z" fill="#c1e5a6"/><rect x="64" y="740" width="1072" height="90" rx="23" fill="#e6f5e9" stroke="#86c19a" stroke-width="2"/><text x="606" y="779" fill="#245c49" font-size="26" font-weight="750" text-anchor="middle">深度优先：递归 / 栈   ｜   层序遍历：队列</text><text x="606" y="808" fill="#4a695b" font-size="18" font-weight="500" text-anchor="middle">实际应用中，先画树、标访问顺序，再写代码最不容易出错。</text></g></svg>
