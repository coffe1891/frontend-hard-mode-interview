<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title description"><title id="title">同一棵树，四种访问顺序</title><desc id="description">“根”在前、中、后，或者按层访问，结果都不同。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L9 3 z" fill="#3778ba"/></marker></defs><rect width="960" height="510" rx="20" fill="#ffffff" stroke="#d9e2ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="45" font-size="27" font-weight="700" fill="#183153" text-anchor="start">同一棵树，四种访问顺序</text><text x="38" y="75" font-size="17" font-weight="400" fill="#54657c" text-anchor="start">“根”在前、中、后，或者按层访问，结果都不同。</text><line x1="38" y1="92" x2="922" y2="92" stroke="#91a6bb" stroke-width="2" /><g stroke="#91a6bb" stroke-width="3"><path d="M480 165 L340 233 M480 165 L620 233 M340 256 L270 317 M340 256 L410 317" fill="none"/></g><circle cx="480" cy="146" r="30" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="480" y="154" font-size="23" font-weight="700" fill="#183153" text-anchor="middle">1</text><circle cx="340" cy="237" r="30" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="340" y="245" font-size="23" font-weight="700" fill="#183153" text-anchor="middle">2</text><circle cx="620" cy="237" r="30" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="620" y="245" font-size="23" font-weight="700" fill="#183153" text-anchor="middle">3</text><circle cx="270" cy="327" r="30" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="270" y="335" font-size="23" font-weight="700" fill="#183153" text-anchor="middle">4</text><circle cx="410" cy="327" r="30" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="410" y="335" font-size="23" font-weight="700" fill="#183153" text-anchor="middle">5</text><rect x="55" y="390" width="195" height="71" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="152.5" y="425" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">前序：根左右</text><text x="152.5" y="457" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">1 → 2 → 4 → 5 → 3</text><rect x="273" y="390" width="195" height="71" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="370.5" y="425" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">中序：左根右</text><text x="370.5" y="457" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">4 → 2 → 5 → 1 → 3</text><rect x="491" y="390" width="195" height="71" rx="14" fill="#f0eaff" stroke="#7658a9" stroke-width="2"/><text x="588.5" y="425" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">后序：左右根</text><text x="588.5" y="457" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">4 → 5 → 2 → 3 → 1</text><rect x="709" y="390" width="195" height="71" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="806.5" y="425" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">层序：按层看</text><text x="806.5" y="457" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">1 → 2 → 3 → 4 → 5</text><text x="66" y="489" font-size="17" font-weight="500" fill="#54657c" text-anchor="start">观察：深度优先通常用递归/栈；层序遍历通常用队列。</text></g></svg>
