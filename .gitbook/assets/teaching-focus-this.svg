<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">四种调用方式决定 JavaScript 函数里的 this 值</title><desc id="desc">普通函数在严格模式下 this 是 undefined；对象方法、显式绑定和 new 调用分别有各自规则，箭头函数另当别论。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6c91c1"/></marker></defs><rect x="1" y="1" width="958" height="298" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="19" y="52" width="220" height="196" rx="12" fill="#fff" stroke="#d7e2ed" stroke-width="2"/><text x="129" y="86" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">普通调用</text><rect x="40" y="108" width="178" height="47" rx="10" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="129" y="138" text-anchor="middle" font-size="20" font-weight="600" fill="#263650">fn()</text><path d="M129,161 L129,187" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="129" y="220" text-anchor="middle" font-size="17" font-weight="500" fill="#263650">严格模式 undefined</text><rect x="255" y="52" width="220" height="196" rx="12" fill="#fff" stroke="#d7e2ed" stroke-width="2"/><text x="365" y="86" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">方法调用</text><rect x="276" y="108" width="178" height="47" rx="10" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="365" y="138" text-anchor="middle" font-size="20" font-weight="600" fill="#263650">obj.fn()</text><path d="M365,161 L365,187" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="365" y="220" text-anchor="middle" font-size="17" font-weight="500" fill="#263650">this → obj</text><rect x="491" y="52" width="220" height="196" rx="12" fill="#fff" stroke="#d7e2ed" stroke-width="2"/><text x="601" y="86" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">显式绑定</text><rect x="512" y="108" width="178" height="47" rx="10" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="601" y="138" text-anchor="middle" font-size="20" font-weight="600" fill="#263650">fn.call(obj)</text><path d="M601,161 L601,187" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="601" y="220" text-anchor="middle" font-size="17" font-weight="500" fill="#263650">this → obj</text><rect x="727" y="52" width="220" height="196" rx="12" fill="#fff" stroke="#d7e2ed" stroke-width="2"/><text x="837" y="86" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">构造调用</text><rect x="748" y="108" width="178" height="47" rx="10" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="837" y="138" text-anchor="middle" font-size="20" font-weight="600" fill="#263650">new Foo()</text><path d="M837,161 L837,187" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="837" y="220" text-anchor="middle" font-size="17" font-weight="500" fill="#263650">this → 新实例</text><text x="480" y="279" text-anchor="middle" font-size="18" font-weight="500" fill="#627389">判断 this，重点看函数如何被调用，不是在哪里定义。</text></g></svg>
