<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">TCP、UDP 与 TLS 的基本区别：可靠传输、数据报与加密认证</title><desc id="desc">TCP 提供面向连接的可靠字节流；UDP 提供数据报；TLS 用于安全通信。常见 TLS over TCP，QUIC 则在 UDP 上使用 TLS 1.3。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6c91c1"/></marker></defs><rect x="1" y="1" width="958" height="298" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="23" y="46" width="288" height="208" rx="12" fill="#fff" stroke="#d7e1ed" stroke-width="2"/><rect x="60" y="70" width="214" height="53" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="167" y="104" text-anchor="middle" font-size="26" font-weight="700" fill="#263650">TCP</text><text x="167" y="167" text-anchor="middle" font-size="19" font-weight="600" fill="#263650">按序可靠传输</text><text x="167" y="214" text-anchor="middle" font-size="17" font-weight="450" fill="#627389">面向连接</text><rect x="337" y="46" width="288" height="208" rx="12" fill="#fff" stroke="#d7e1ed" stroke-width="2"/><rect x="374" y="70" width="214" height="53" rx="12" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="481" y="104" text-anchor="middle" font-size="26" font-weight="700" fill="#263650">UDP</text><text x="481" y="167" text-anchor="middle" font-size="19" font-weight="600" fill="#263650">独立数据报</text><text x="481" y="214" text-anchor="middle" font-size="17" font-weight="450" fill="#627389">自身不保证可靠</text><rect x="651" y="46" width="288" height="208" rx="12" fill="#fff" stroke="#d7e1ed" stroke-width="2"/><rect x="688" y="70" width="214" height="53" rx="12" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="795" y="104" text-anchor="middle" font-size="26" font-weight="700" fill="#263650">TLS</text><text x="795" y="167" text-anchor="middle" font-size="19" font-weight="600" fill="#263650">加密与身份认证</text><text x="795" y="214" text-anchor="middle" font-size="17" font-weight="450" fill="#627389">常见于 TCP 上</text><text x="480" y="284" text-anchor="middle" font-size="16" font-weight="440" fill="#627389">另：HTTP/3 的 QUIC 运行在 UDP 上，并使用 TLS 1.3。</text></g></svg>
