<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">V8 从 JavaScript 源码解析、生成字节码，再优化热点代码的核心路径</title><desc id="desc">这是简化后的执行路径：Ignition 执行字节码，TurboFan 优化部分热点代码，必要时可能去优化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6c91c1"/></marker></defs><rect x="1" y="1" width="958" height="298" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="28" y="91" width="203" height="89" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="129.5" y="122" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">JavaScript</text><text x="129.5" y="150" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">源代码</text><rect x="262" y="91" width="203" height="89" rx="12" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="363.5" y="122" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">Parser</text><text x="363.5" y="150" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">解析成 AST</text><rect x="496" y="91" width="203" height="89" rx="12" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="597.5" y="122" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">Ignition</text><text x="597.5" y="150" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">执行字节码</text><rect x="730" y="91" width="203" height="89" rx="12" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="831.5" y="122" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">TurboFan</text><text x="831.5" y="150" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">优化机器码</text><path d="M233,134 L258,134" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M467,134 L492,134" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M701,134 L726,134" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M829 188 C829 261 594 263 594 188" fill="none" stroke="#a9b8cc" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="716" y="251" text-anchor="middle" font-size="16" font-weight="450" fill="#627389">去优化（可能）</text><text x="479" y="58" text-anchor="middle" font-size="18" font-weight="550" fill="#263650">字节码可先执行；热点函数可能被进一步优化</text></g></svg>
