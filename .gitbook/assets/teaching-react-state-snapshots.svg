<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title description"><title id="title">React Hooks：每次渲染都是一张快照</title><desc id="description">旧事件处理函数看到的 count，来自创建它的那次渲染。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L9 3 z" fill="#3778ba"/></marker></defs><rect width="960" height="400" rx="20" fill="#fff" stroke="#d9e2ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="45" font-size="27" font-weight="700" fill="#183153" text-anchor="start">React Hooks：每次渲染都是一张快照</text><text x="38" y="75" font-size="17" font-weight="400" fill="#54657c" text-anchor="start">旧事件处理函数看到的 count，来自创建它的那次渲染。</text><line x1="38" y1="92" x2="922" y2="92" stroke="#dce5ee" stroke-width="2"/><rect x="39" y="127" width="239" height="104" rx="14" fill="#e6f1ff" stroke="#3778ba" stroke-width="2"/><text x="158.5" y="163" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">第一次渲染</text><text x="158.5" y="192" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">count = 0</text><rect x="361" y="127" width="237" height="104" rx="14" fill="#fff1e3" stroke="#c97936" stroke-width="2"/><text x="479.5" y="163" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">点击事件</text><text x="479.5" y="192" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">setCount(c =&gt; c + 1)</text><rect x="682" y="127" width="239" height="104" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="801.5" y="163" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">下一次渲染</text><text x="801.5" y="192" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">count = 1</text><path d="M278 179 L360 179" fill="none" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><path d="M598 179 L681 179" fill="none" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="284" width="360" height="79" rx="14" fill="#f0eaff" stroke="#7658a9" stroke-width="2"/><text x="220" y="320" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">旧闭包：console.log(count)</text><text x="220" y="349" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">仍打印 0</text><rect x="558" y="284" width="360" height="79" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="738" y="320" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">新界面：显示当前状态</text><text x="738" y="349" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">按钮显示 1</text><path d="M175 232 L175 283" fill="none" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><path d="M801 232 L801 283" fill="none" stroke="#3778ba" stroke-width="2.5" marker-end="url(#arr)"/><text x="479" y="383" font-size="16" font-weight="500" fill="#54657c" text-anchor="middle">理解关键：更新状态后，会生成新一轮渲染；旧渲染的局部变量不被改写。</text></g></svg>
