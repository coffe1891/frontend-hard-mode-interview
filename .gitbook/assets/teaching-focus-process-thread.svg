<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">进程拥有隔离资源，线程执行任务，协程可在同一线程中交替推进</title><desc id="desc">进程是资源隔离边界；线程是执行单元；协程由运行机制协作切换，不等于多开 CPU 线程。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="14" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="37" y="45" width="472" height="190" rx="14" fill="#fff" stroke="#b6cbdf" stroke-width="2"/><text x="127" y="79" font-size="21" font-weight="700" fill="#263650" text-anchor="middle">进程 A</text><rect x="65" y="106" width="192" height="70" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="160" y="136" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">线程 1</text><text x="160" y="158" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">执行任务</text><rect x="282" y="106" width="198" height="70" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="381" y="136" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">线程 2</text><text x="381" y="158" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">执行任务</text><rect x="84" y="195" width="384" height="24" rx="9" fill="#eff2f7" stroke="#c6d1df" stroke-width="2"/><text x="275" y="213" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">同一进程内可共享部分内存</text><rect x="529" y="45" width="396" height="190" rx="14" fill="#fff" stroke="#b6cbdf" stroke-width="2"/><text x="724" y="79" font-size="20" font-weight="700" fill="#263650" text-anchor="middle">同一线程内的协作任务</text><rect x="551" y="110" width="108" height="62" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="605" y="144" font-size="18" font-weight="600" fill="#263650" text-anchor="middle">协程 A</text><path d="M661 141 L709 141" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="715" y="110" width="108" height="62" rx="14" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="769" y="144" font-size="18" font-weight="600" fill="#263650" text-anchor="middle">协程 B</text><path d="M770 177 C745 223 617 222 608 178" stroke="#ab96d3" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="717" y="220" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">让出后可恢复</text><text x="480" y="274" font-size="17" font-weight="450" fill="#627389" text-anchor="middle">协程切换是协作调度，不等于同时占用多个 CPU 核</text></g></svg>
