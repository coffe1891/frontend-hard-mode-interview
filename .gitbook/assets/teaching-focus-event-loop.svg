<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">浏览器事件循环一次轮转中同步任务、微任务和定时器回调的顺序</title><desc id="desc">当前同步脚本完成后会执行微任务检查点，再处理后续任务；浏览器可能在任务之间安排渲染。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6c91c1"/></marker></defs><rect x="1" y="1" width="958" height="298" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="27" y="75" width="191" height="135" rx="12" fill="#fff" stroke="#becddd" stroke-width="2"/><text x="122" y="107" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">当前调用栈</text><rect x="50" y="135" width="144" height="54" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="122" y="168" text-anchor="middle" font-size="22" font-weight="650" fill="#263650">script</text><rect x="270" y="52" width="222" height="92" rx="12" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="380" y="85" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">微任务</text><text x="380" y="117" text-anchor="middle" font-size="18" font-weight="500" fill="#263650">Promise.then()</text><rect x="270" y="160" width="222" height="92" rx="12" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="380" y="194" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">后续任务</text><text x="380" y="224" text-anchor="middle" font-size="18" font-weight="500" fill="#263650">setTimeout()</text><path d="M220,149 L267,99" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M494,100 L569,149" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M494,204 L569,149" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="587" y="61" width="345" height="191" rx="12" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><text x="761" y="91" text-anchor="middle" font-size="19" font-weight="600" fill="#263650">实际执行顺序（示意）</text><rect x="612" y="109" width="294" height="37" rx="9" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="636" y="135" text-anchor="middle" font-size="17" font-weight="650" fill="#263650">①</text><text x="763" y="135" text-anchor="middle" font-size="17" font-weight="550" fill="#263650">同步 script</text><rect x="612" y="155" width="294" height="37" rx="9" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="636" y="181" text-anchor="middle" font-size="17" font-weight="650" fill="#263650">②</text><text x="763" y="181" text-anchor="middle" font-size="17" font-weight="550" fill="#263650">清空微任务</text><rect x="612" y="201" width="294" height="37" rx="9" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="636" y="227" text-anchor="middle" font-size="17" font-weight="650" fill="#263650">③</text><text x="763" y="227" text-anchor="middle" font-size="17" font-weight="550" fill="#263650">后续 timer 任务</text></g></svg>
