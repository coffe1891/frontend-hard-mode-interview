<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Node.js 等待网络 I/O 时主线程可以继续处理其他任务</title><desc id="desc">等待网络 I/O 不必占住 JavaScript 主线程；但同步计算仍会阻塞它。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="54" y="70" text-anchor="start" font-size="20" font-weight="650" fill="#263650">JS 主线程</text><path d="M200 75 L906 75" fill="none" stroke="#cfd9e5" stroke-width="5" stroke-linecap="round"/><rect x="235" y="49" width="147" height="51" rx="10" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="308" y="81" text-anchor="middle" font-size="19" font-weight="600" fill="#263650">处理请求 A</text><rect x="460" y="49" width="151" height="51" rx="10" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="536" y="81" text-anchor="middle" font-size="19" font-weight="600" fill="#263650">继续处理 B</text><rect x="760" y="49" width="140" height="51" rx="10" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="830" y="81" text-anchor="middle" font-size="18" font-weight="600" fill="#263650">执行 A 回调</text><path d="M382 74 L458 74" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M612 74 L758 74" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="54" y="171" text-anchor="start" font-size="20" font-weight="650" fill="#263650">网络 I/O</text><path d="M200 174 L906 174" fill="none" stroke="#cfd9e5" stroke-width="5" stroke-linecap="round"/><rect x="390" y="143" width="298" height="62" rx="12" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="539" y="170" text-anchor="middle" font-size="18" font-weight="600" fill="#263650">等待请求 A 的网络响应</text><text x="539" y="191" text-anchor="middle" font-size="14" font-weight="400" fill="#627389">这段时间 JS 可以处理 B</text><path d="M381 98 C381 123 390 124 390 141" stroke="#d2a96d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M687 174 C754 174 756 112 797 103" stroke="#6f9fc8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="485" y="261" text-anchor="middle" font-size="18" font-weight="450" fill="#627389">主线程负责执行 JS；等待 I/O 的工作由运行时与操作系统协调。</text></g></svg>
