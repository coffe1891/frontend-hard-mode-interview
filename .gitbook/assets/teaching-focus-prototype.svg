<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">JavaScript 属性查找先看对象自身，找不到再沿原型链向上</title><desc id="desc">示意对象 obj 的 name 不在自身，却能从 Person.prototype 找到；若始终找不到，查找最终在 null 处结束。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6c91c1"/></marker></defs><rect x="1" y="1" width="958" height="298" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="42" y="84" width="185" height="107" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="134.5" y="115" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">obj</text><text x="134.5" y="143" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">age: 18</text><rect x="268" y="84" width="185" height="107" rx="12" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="360.5" y="115" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">Person.prototype</text><text x="360.5" y="143" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">name: 'Tom'</text><rect x="504" y="84" width="185" height="107" rx="12" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="596.5" y="115" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">Object.prototype</text><text x="596.5" y="143" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">toString()</text><rect x="767" y="84" width="185" height="107" rx="12" fill="#eff1f4" stroke="#aeb9c6" stroke-width="2"/><text x="859.5" y="115" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">null</text><text x="859.5" y="143" text-anchor="middle" font-size="15" font-weight="430" fill="#627389">链尾</text><path d="M229,141 L267,141" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M455,141 L503,141" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M691,141 L765,141" fill="none" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="476" y="49" text-anchor="middle" font-size="18" font-weight="600" fill="#263650">查找 obj.name：对象上没有 → 去原型上找</text><text x="362" y="225" text-anchor="middle" font-size="17" font-weight="600" fill="#7e63b4">在此找到 name</text><text x="480" y="271" text-anchor="middle" font-size="16" font-weight="450" fill="#627389">箭头表示原型引用；查找找到属性后就停止。</text></g></svg>
