<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">抽象 Shape 规定 area 方法，由具体 Circle 和 Rectangle 类分别实现</title><desc id="desc">抽象类可声明由子类实现的抽象方法，本身通常不能直接实例化；注意虚方法与抽象方法并非在所有语言中同义。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce5ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="303" y="33" width="347" height="93" rx="14" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="476.5" y="68" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">abstract Shape</text><text x="476.5" y="99" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">abstract area(): number</text><path d="M387 133 L255 181" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M568 133 L700 181" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="63" y="183" width="349" height="70" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="237.5" y="218" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">Circle</text><text x="237.5" y="249" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">area() = πr²</text><rect x="548" y="183" width="349" height="70" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="722.5" y="218" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">Rectangle</text><text x="722.5" y="249" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">area() = 长 × 宽</text><text x="483" y="280" text-anchor="middle" font-size="17" font-weight="500" fill="#61748b">抽象类确定共同约定，子类提供各自的计算方式</text></g></svg>
