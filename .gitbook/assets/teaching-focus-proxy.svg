<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Proxy 拦截属性写入并通过 Reflect 完成原始对象操作</title><desc id="desc">Proxy 的 set 陷阱可先检查或记录写入，再用 Reflect.set 修改目标；仅拦截本身不等于自动响应式。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="14" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="35" y="92" width="202" height="88" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="136" y="125" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">业务代码</text><text x="136" y="153" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">state.price = 30</text><path d="M247 135 L295 135" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="307" y="92" width="216" height="88" rx="14" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="415" y="125" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">Proxy.set()</text><text x="415" y="153" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">拦截赋值</text><path d="M532 135 L579 135" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="592" y="92" width="167" height="88" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="675.5" y="125" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">Reflect.set</text><text x="675.5" y="153" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">转交目标操作</text><path d="M771 135 L798 135" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="803" y="92" width="124" height="88" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="865" y="125" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">target</text><text x="865" y="153" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">price=30</text><text x="472" y="59" font-size="21" font-weight="650" fill="#263650" text-anchor="middle">写入先经过代理，再由 Reflect 转发</text><text x="480" y="257" font-size="17" font-weight="450" fill="#627389" text-anchor="middle">Proxy 可以加入日志与校验，是否触发视图更新还需要额外机制</text></g></svg>
