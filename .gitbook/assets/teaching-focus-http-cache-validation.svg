<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">协商缓存请求与 304、200 响应的关系</title><desc id="desc">已有缓存变旧后，浏览器带上 ETag 发起条件请求；304 复用本地资源，200 下载新资源。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#769bc4"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce5ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="475" y="43" text-anchor="middle" font-size="23" font-weight="700" fill="#263650">协商缓存：旧资源还有效吗？</text><rect x="34" y="98" width="213" height="90" rx="14" fill="#eaf3fe" stroke="#88b4e1" stroke-width="2"/><text x="140" y="132" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">浏览器已有缓存</text><text x="140" y="160" text-anchor="middle" font-size="18" font-weight="500" fill="#263650">ETag: v3</text><path d="M260 144 L316 144" stroke="#769bc4" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round"/><rect x="328" y="98" width="253" height="90" rx="14" fill="#f0ebfa" stroke="#b8a4d8" stroke-width="2"/><text x="455" y="131" text-anchor="middle" font-size="18" font-weight="650" fill="#263650">请求 If-None-Match</text><text x="455" y="161" text-anchor="middle" font-size="18" font-weight="500" fill="#263650">服务器比对 v3</text><path d="M595 143 L649 143" stroke="#769bc4" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-linecap="round"/><rect x="662" y="56" width="266" height="79" rx="14" fill="#e8f5ef" stroke="#8dbda6" stroke-width="2"/><text x="795" y="91" text-anchor="middle" font-size="18" font-weight="650" fill="#263650">304：版本没变</text><text x="795" y="116" text-anchor="middle" font-size="16" font-weight="500" fill="#263650">复用本地资源</text><rect x="662" y="167" width="266" height="79" rx="14" fill="#fff0df" stroke="#dba66d" stroke-width="2"/><text x="795" y="201" text-anchor="middle" font-size="18" font-weight="650" fill="#263650">200：内容已变</text><text x="795" y="226" text-anchor="middle" font-size="16" font-weight="500" fill="#263650">下载并替换缓存</text><path d="M622 144 L622 96 L651 96" fill="none" stroke="#769bc4" stroke-width="3" marker-end="url(#arr)"/><path d="M622 144 L622 207 L651 207" fill="none" stroke="#769bc4" stroke-width="3" marker-end="url(#arr)"/><text x="479" y="282" text-anchor="middle" font-size="16" font-weight="450" fill="#627389">这是缓存过期后的验证流程；缓存仍新鲜时通常无需发送请求。</text></g></svg>
