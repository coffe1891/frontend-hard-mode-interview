<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">await 暂停当前 async 函数，但不会阻塞整个 JavaScript 主线程</title><desc id="desc">等待 Promise 时暂停的是当前 async 函数；其他任务仍有机会运行，结果就绪后再继续。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="14" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="45" y="89" width="228" height="94" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="159" y="122" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">async 函数</text><text x="159" y="150" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">执行到 await fetch()</text><path d="M283 135 L352 135" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="365" y="89" width="236" height="94" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="483" y="122" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">等待网络结果</text><text x="483" y="150" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">当前函数暂时挂起</text><path d="M610 135 L693 135" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="705" y="89" width="221" height="94" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="815.5" y="122" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">结果返回</text><text x="815.5" y="150" font-size="15" font-weight="450" fill="#627389" text-anchor="middle">继续 async 函数</text><path d="M483 191 C483 245 671 245 770 191" stroke="#a78ccf" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="359" y="226" width="255" height="39" rx="12" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="486" y="251" font-size="17" font-weight="550" fill="#263650" text-anchor="middle">期间主线程可执行其他任务</text><text x="478" y="54" font-size="20" font-weight="650" fill="#263650" text-anchor="middle">await 不等于堵住整条 JS 执行线程</text></g></svg>
