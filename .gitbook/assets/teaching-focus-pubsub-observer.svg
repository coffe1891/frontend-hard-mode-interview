<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">观察者模式直接持有订阅者，发布订阅通过事件中心转发通知</title><desc id="desc">观察者由 Subject 直接通知观察者；发布订阅通过事件中心把发布者和订阅者解耦。事件中心并不一定异步。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce5ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="28" y="30" width="425" height="213" rx="14" fill="#fff" stroke="#dbe5ef" stroke-width="2"/><text x="240" y="62" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">观察者：直接通知</text><rect x="60" y="97" width="166" height="101" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="143" y="131" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">Subject</text><text x="143" y="159" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">维护订阅者列表</text><path d="M234 131 L290 108" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M234 163 L290 193" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="300" y="80" width="132" height="51" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="366" y="112" text-anchor="middle" font-size="17" font-weight="600" fill="#263650">Observer A</text><rect x="300" y="172" width="132" height="51" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="366" y="205" text-anchor="middle" font-size="17" font-weight="600" fill="#263650">Observer B</text><rect x="480" y="30" width="453" height="213" rx="14" fill="#fff" stroke="#dbe5ef" stroke-width="2"/><text x="707" y="62" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">发布订阅：事件中心转发</text><rect x="501" y="104" width="118" height="88" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="560" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">发布者</text><text x="560" y="166" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">emit()</text><path d="M628 150 L659 150" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="666" y="105" width="129" height="87" rx="14" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="730.5" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">EventBus</text><text x="730.5" y="167" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">事件中心</text><path d="M804 150 L827 150" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="829" y="100" width="94" height="96" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="876" y="133" text-anchor="middle" font-size="16" font-weight="650" fill="#263650">订阅者</text><text x="876" y="162" text-anchor="middle" font-size="17" font-weight="600" fill="#263650">A / B</text><text x="480" y="272" text-anchor="middle" font-size="17" font-weight="500" fill="#61748b">有没有中间的事件中心，是两种结构最直观的差别</text></g></svg>
