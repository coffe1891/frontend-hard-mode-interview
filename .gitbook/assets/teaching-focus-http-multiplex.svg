<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">HTTP 1.1 单连接与 HTTP 2 多路复用的请求传输对比</title><desc id="desc">这张图只比较单条连接内的消息组织方式：HTTP/2 可以交错传输不同流的帧；它并不消除 TCP 层丢包的影响。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="14" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="36" y="47" width="426" height="193" rx="14" fill="#fff" stroke="#d5e2ef" stroke-width="2"/><text x="245" y="78" font-size="20" font-weight="700" fill="#263650" text-anchor="middle">HTTP/1.1（单连接示意）</text><rect x="71" y="114" width="147" height="54" rx="14" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="145" y="146" font-size="19" font-weight="650" fill="#263650" text-anchor="middle">请求 A</text><path d="M225 141 L275 141" stroke="#6c91c1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="285" y="114" width="147" height="54" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="358" y="146" font-size="19" font-weight="650" fill="#263650" text-anchor="middle">请求 B</text><text x="244" y="216" font-size="16" font-weight="450" fill="#627389" text-anchor="middle">单连接中请求需排队处理响应</text><rect x="496" y="47" width="428" height="193" rx="14" fill="#fff" stroke="#d5e2ef" stroke-width="2"/><text x="710" y="78" font-size="20" font-weight="700" fill="#263650" text-anchor="middle">HTTP/2（多路复用）</text><rect x="526" y="114" width="67" height="54" rx="10" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="559" y="146" font-size="19" font-weight="700" fill="#263650" text-anchor="middle">A1</text><rect x="603" y="114" width="67" height="54" rx="10" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="636" y="146" font-size="19" font-weight="700" fill="#263650" text-anchor="middle">B1</text><rect x="680" y="114" width="67" height="54" rx="10" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="713" y="146" font-size="19" font-weight="700" fill="#263650" text-anchor="middle">A2</text><rect x="757" y="114" width="67" height="54" rx="10" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="790" y="146" font-size="19" font-weight="700" fill="#263650" text-anchor="middle">B2</text><rect x="834" y="114" width="67" height="54" rx="10" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="867" y="146" font-size="19" font-weight="700" fill="#263650" text-anchor="middle">A3</text><text x="708" y="216" font-size="16" font-weight="450" fill="#627389" text-anchor="middle">同一连接中交错传输不同流的帧</text><text x="478" y="274" font-size="16" font-weight="450" fill="#627389" text-anchor="middle">A、B 表示不同请求；图中省略连接数和传输层细节</text></g></svg>
