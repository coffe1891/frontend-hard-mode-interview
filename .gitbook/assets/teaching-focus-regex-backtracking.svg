<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">嵌套量词使正则引擎不断尝试不同分组，缺少结尾 b 时发生大量回溯</title><desc id="desc">`/(a+)+b/` 在一串 a 后找不到 b，会反复改变 a 的分组方式；输入增长时，尝试次数可能急剧增加。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce5ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="481" y="41" text-anchor="middle" font-size="22" font-weight="700" fill="#263650">/(a+)+b/ 匹配 “aaaaaa”</text><rect x="65" y="72" width="327" height="143" rx="14" fill="#fff" stroke="#d7e4f1" stroke-width="2"/><text x="229" y="101" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">尝试不同分组</text><rect x="90" y="119" width="135" height="41" rx="10" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="156" y="146" text-anchor="middle" font-size="20" font-weight="600" fill="#263650">aaaa</text><rect x="230" y="119" width="123" height="41" rx="10" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="291" y="146" text-anchor="middle" font-size="20" font-weight="600" fill="#263650">aa</text><rect x="90" y="171" width="135" height="32" rx="10" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="156" y="192" text-anchor="middle" font-size="18" font-weight="600" fill="#263650">aaa</text><rect x="230" y="171" width="123" height="32" rx="10" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="291" y="192" text-anchor="middle" font-size="18" font-weight="600" fill="#263650">aaa</text><path d="M402 145 L520 145" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="529" y="87" width="195" height="104" rx="14" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="626.5" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#263650">末尾没有 b</text><text x="626.5" y="153" text-anchor="middle" font-size="16" font-weight="450" fill="#61748b">匹配失败</text><path d="M735 145 L837 145" stroke="#6c91c1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="829" y="111" width="98" height="64" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="878" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#263650">回溯</text><text x="878" y="162" text-anchor="middle" font-size="16" font-weight="500" fill="#263650">重试</text><text x="480" y="258" text-anchor="middle" font-size="17" font-weight="500" fill="#61748b">同一串 a 有很多种分组，嵌套量词可能造成重复搜索</text></g></svg>
