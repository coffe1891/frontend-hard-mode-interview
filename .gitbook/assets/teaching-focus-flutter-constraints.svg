<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Flutter Expanded 需要父布局给出有限高度，否则无法分配剩余空间</title><desc id="desc">`Expanded` 要分配剩余空间，必须先知道总高度；在无限高度的滚动布局中直接使用可能触发布局约束错误。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce5ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="36" y="33" width="430" height="225" rx="14" fill="#fff" stroke="#d6e3ef" stroke-width="2"/><text x="251" y="66" text-anchor="middle" font-size="21" font-weight="700" fill="#263650">有高度约束</text><rect x="100" y="90" width="298" height="136" rx="14" fill="#f8fbff" stroke="#9fbce0" stroke-width="2"/><text x="247" y="113" text-anchor="middle" font-size="17" font-weight="600" fill="#263650">父 Column：高 200</text><rect x="121" y="133" width="257" height="65" rx="14" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="250" y="162" text-anchor="middle" font-size="21" font-weight="650" fill="#263650">Expanded</text><text x="250" y="185" text-anchor="middle" font-size="15" font-weight="450" fill="#61748b">分到确定的剩余高度</text><rect x="495" y="33" width="430" height="225" rx="14" fill="#fff" stroke="#d6e3ef" stroke-width="2"/><text x="709" y="66" text-anchor="middle" font-size="21" font-weight="700" fill="#263650">高度无限制</text><rect x="560" y="90" width="300" height="136" rx="14" fill="#fffaf5" stroke="#ddbc99" stroke-width="2"/><text x="711" y="113" text-anchor="middle" font-size="17" font-weight="600" fill="#263650">滚动容器里的 Column</text><rect x="588" y="133" width="244" height="65" rx="14" fill="#fff0df" stroke="#dca66b" stroke-width="2"/><text x="709" y="161" text-anchor="middle" font-size="21" font-weight="650" fill="#263650">Expanded</text><text x="709" y="185" text-anchor="middle" font-size="15" font-weight="450" fill="#61748b">不知道剩余高度</text><text x="479" y="283" text-anchor="middle" font-size="17" font-weight="500" fill="#61748b">核心是父约束与子尺寸的关系，不是简单多包一层 Widget</text></g></svg>
