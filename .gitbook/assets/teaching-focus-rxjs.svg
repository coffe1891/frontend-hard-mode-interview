<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">RxJS switchMap 切换新搜索后，不再把旧搜索结果显示到页面</title><desc id="desc">新关键词到来后 `switchMap` 不再采用旧订阅结果；旧网络请求是否真的取消取决于底层实现。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="80" y="78" text-anchor="start" font-size="17" font-weight="650" fill="#263650">旧搜索</text><rect x="215" y="44" width="173" height="58" rx="12" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="301" y="78" text-anchor="middle" font-size="23" font-weight="700" fill="#263650">react</text><text x="80" y="182" text-anchor="start" font-size="17" font-weight="650" fill="#263650">新搜索</text><rect x="215" y="147" width="173" height="58" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="301" y="183" text-anchor="middle" font-size="23" font-weight="700" fill="#263650">vue</text><path d="M398 71 L670 71" stroke="#d3b4b6" stroke-width="2" fill="none"/><path d="M398 174 L670 174" stroke="#a4c8b7" stroke-width="2" fill="none"/><text x="519" y="58" text-anchor="middle" font-size="17" font-weight="450" fill="#627389">旧请求较慢</text><text x="519" y="160" text-anchor="middle" font-size="17" font-weight="450" fill="#627389">新请求较快</text><rect x="650" y="39" width="145" height="64" rx="13" fill="#f9e8e8" stroke="#dfaaa9" stroke-width="2"/><text x="723" y="65" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">旧结果</text><text x="723" y="87" text-anchor="middle" font-size="15" font-weight="450" fill="#627389">不再显示</text><rect x="650" y="141" width="145" height="65" rx="13" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="723" y="169" text-anchor="middle" font-size="19" font-weight="650" fill="#263650">新结果</text><text x="723" y="191" text-anchor="middle" font-size="16" font-weight="600" fill="#3a8a6e">显示</text><rect x="808" y="111" width="126" height="67" rx="12" fill="#fff" stroke="#b8cce0" stroke-width="2"/><text x="871" y="138" text-anchor="middle" font-size="18" font-weight="650" fill="#263650">页面</text><text x="871" y="161" text-anchor="middle" font-size="15" font-weight="550" fill="#627389">Vue 结果</text><path d="M794 174 L806 155" fill="none" stroke="#6c91c1" stroke-width="3" marker-end="url(#arr)"/><text x="477" y="272" text-anchor="middle" font-size="18" font-weight="450" fill="#627389">重点：新的搜索结果不能被更早、却更晚返回的旧结果覆盖。</text></g></svg>
