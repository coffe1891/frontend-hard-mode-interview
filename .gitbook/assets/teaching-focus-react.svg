<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">React 旧渲染的事件处理函数仍读取 count 等于零，新渲染才读取一</title><desc id="desc">状态更新不会改写旧闭包中的 count；新的一轮渲染才拿到更新后的值。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6c91c1"/></marker></defs><rect width="960" height="300" rx="16" fill="#fcfdff" stroke="#dce4ef" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><rect x="64" y="49" width="313" height="198" rx="15" fill="#fff" stroke="#dfe6ef" stroke-width="2"/><text x="219" y="85" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">旧渲染快照</text><rect x="103" y="108" width="226" height="76" rx="13" fill="#f0ebfb" stroke="#ab95d9" stroke-width="2"/><text x="217" y="139" text-anchor="middle" font-size="24" font-weight="700" fill="#263650">count = 0</text><text x="217" y="165" text-anchor="middle" font-size="15" font-weight="500" fill="#627389">事件函数仍读到 0</text><rect x="583" y="49" width="313" height="198" rx="15" fill="#fff" stroke="#dfe6ef" stroke-width="2"/><text x="739" y="85" text-anchor="middle" font-size="20" font-weight="650" fill="#263650">新渲染快照</text><rect x="622" y="108" width="226" height="76" rx="13" fill="#e8f5ef" stroke="#6ab89c" stroke-width="2"/><text x="735" y="139" text-anchor="middle" font-size="24" font-weight="700" fill="#263650">count = 1</text><text x="735" y="165" text-anchor="middle" font-size="15" font-weight="500" fill="#627389">页面现在显示 1</text><path d="M382 148 L577 148" fill="none" stroke="#6c91c1" stroke-width="3" marker-end="url(#arr)"/><rect x="405" y="110" width="147" height="68" rx="12" fill="#e7f1fc" stroke="#7caad8" stroke-width="2"/><text x="478" y="138" text-anchor="middle" font-size="18" font-weight="650" fill="#263650">setCount</text><text x="478" y="161" text-anchor="middle" font-size="15" font-weight="450" fill="#627389">安排更新</text><text x="479" y="277" text-anchor="middle" font-size="17" font-weight="450" fill="#627389">旧照片不会被改写；React 会产生一张新快照。</text></g></svg>
