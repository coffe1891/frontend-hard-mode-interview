<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title description"><title id="title">RxJS 搜索框：把连续输入变成可控数据流</title><desc id="description">示例时间线：短暂停顿后才请求；新关键词到来时不再采用旧结果。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L9 3 z" fill="#3778ba"/></marker></defs><rect width="960" height="440" rx="20" fill="#fff" stroke="#d9e2ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="45" font-size="27" font-weight="700" fill="#183153" text-anchor="start">RxJS 搜索框：把连续输入变成可控数据流</text><text x="38" y="75" font-size="17" font-weight="400" fill="#54657c" text-anchor="start">示例时间线：短暂停顿后才请求；新关键词到来时不再采用旧结果。</text><line x1="38" y1="92" x2="922" y2="92" stroke="#dce5ee" stroke-width="2"/><text x="48" y="143" font-size="18" font-weight="700" fill="#183153" text-anchor="start">输入事件</text><text x="48" y="218" font-size="18" font-weight="700" fill="#183153" text-anchor="start">防抖后</text><text x="48" y="293" font-size="18" font-weight="700" fill="#183153" text-anchor="start">请求结果</text><line x1="190" y1="160" x2="912" y2="160" stroke="#ccd6e2" stroke-width="3"/><line x1="190" y1="230" x2="912" y2="230" stroke="#ccd6e2" stroke-width="3"/><line x1="190" y1="300" x2="912" y2="300" stroke="#ccd6e2" stroke-width="3"/><circle cx="215" cy="160" r="7" fill="#3778ba"/><text x="215" y="139" font-size="16" font-weight="500" fill="#183153" text-anchor="middle">r</text><circle cx="286" cy="160" r="7" fill="#3778ba"/><text x="286" y="139" font-size="16" font-weight="500" fill="#183153" text-anchor="middle">re</text><circle cx="352" cy="160" r="7" fill="#3778ba"/><text x="352" y="139" font-size="16" font-weight="500" fill="#183153" text-anchor="middle">rea</text><circle cx="513" cy="160" r="7" fill="#3778ba"/><text x="513" y="139" font-size="16" font-weight="500" fill="#183153" text-anchor="middle">react</text><circle cx="741" cy="160" r="7" fill="#3778ba"/><text x="741" y="139" font-size="16" font-weight="500" fill="#183153" text-anchor="middle">vue</text><circle cx="452" cy="230" r="7" fill="#c97936"/><text x="452" y="206" font-size="16" font-weight="500" fill="#183153" text-anchor="middle">rea</text><circle cx="614" cy="230" r="7" fill="#c97936"/><text x="614" y="206" font-size="16" font-weight="500" fill="#183153" text-anchor="middle">react</text><circle cx="844" cy="230" r="7" fill="#c97936"/><text x="844" y="206" font-size="16" font-weight="500" fill="#183153" text-anchor="middle">vue</text><rect x="372" y="274" width="155" height="61" rx="14" fill="#f0eaff" stroke="#7658a9" stroke-width="2"/><text x="449.5" y="310" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">rea 请求</text><text x="449.5" y="339" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">旧结果忽略</text><rect x="539" y="274" width="155" height="61" rx="14" fill="#f0eaff" stroke="#7658a9" stroke-width="2"/><text x="616.5" y="310" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">react 请求</text><text x="616.5" y="339" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">旧结果忽略</text><rect x="750" y="274" width="159" height="61" rx="14" fill="#eaf8f1" stroke="#248260" stroke-width="2"/><text x="829.5" y="310" font-size="20" font-weight="600" fill="#183153" text-anchor="middle">vue 请求</text><text x="829.5" y="339" font-size="16" font-weight="400" fill="#54657c" text-anchor="middle">采用新结果</text><text x="47" y="383" font-size="16" font-weight="500" fill="#54657c" text-anchor="start">注：时间点仅为教学示意，真实发出时间由防抖窗口和异步执行时机决定。</text><text x="47" y="411" font-size="16" font-weight="600" fill="#183153" text-anchor="start">关键操作符：fromEvent → debounceTime → distinctUntilChanged → switchMap</text></g></svg>
