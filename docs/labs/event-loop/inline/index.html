  <style>
    :root { color-scheme:light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #ffffff; color:#344054; font-size:14px }
    *, *::before, *::after {box-sizing:border-box}
    body {margin:0; padding:0; background:#ffffff}
    .shell {margin:auto;max-width:920px;border:1px solid #e2e7ec; border-radius:10px; background:#ffffff;overflow:hidden}
    .bar {display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid #e7ebef;background:#f7f9fa}
    .bar strong {font-size:13px;letter-spacing:.25px}
    .caption {font-size:11px;color:#667085}
    textarea {width:100%;height:247px;max-width:100%;resize:vertical;display:block;outline:none;border:0;padding:14px 16px;background:#ffffff;color:#344054;font:13px/1.8 Consolas,ui-monospace,monospace;tab-size:2}
    textarea:focus-visible{box-shadow:inset 0 0 0 2px #a9c9bb}
    .actions {padding:10px 14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-top:1px solid #e7ebef}
    button {border:1px solid #dce2e8;background:#ffffff;color:#475467;padding:8px 13px;border-radius:8px;font-weight:650;cursor:pointer;font-size:12px}
    button:hover {background:#f3f5f7}button:focus-visible{outline:3px solid #9abdab;outline-offset:2px}
    button.primary {border:1px solid #c7ddd2;color:#285640;background:#e9f3ed}
    button.primary:hover{background:#dcece2}
    button:disabled{opacity:.5;cursor:wait}
    .status {margin-left:auto;font-size:11px;color:#667085}
    .result {border-top:1px solid #e7ebef;padding:12px 14px 14px}
    .result h2{font-size:12px;margin:0 0 8px;letter-spacing:.4px}
    #output {margin:0;min-height:72px;max-height:180px;overflow:auto;background:#f7faf8;border-radius:7px;border:1px solid #e1ebe5;padding:10px 12px;color:#315e49;white-space:pre-wrap;word-break:break-word;font:12.5px/1.8 Consolas,ui-monospace,monospace}
    .foot {margin:0;border-top:1px solid #e7ebef;padding:9px 14px;color:#667085;font-size:11px;line-height:1.65}
    @media(max-width:600px){body{padding:0}textarea{font-size:12px;height:235px;padding:11px}.bar{padding:10px}.actions{padding:9px}.foot{padding:9px}}

<body>
  <section class="shell" aria-label="Event Loop 可运行代码">
    <div class="bar"><strong>JavaScript · Event Loop 面试题</strong><span class="caption">可修改 · 在浏览器中运行</span></div>
    <label for="editor" style="display:block;position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">编辑 JavaScript 代码</label>
    <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="可编辑的 JavaScript 示例" aria-describedby="note">setTimeout(function() {
  console.log(1);
}, 0);
new Promise(function(resolve) {
  console.log(2);
  resolve(3);
}).then(function(val) {
  console.log(val);
});
console.log(4);</textarea>
    <div class="actions"><button class="primary" id="run" type="button">▶ 运行代码</button><button id="reset" type="button">恢复原题</button><span class="status" id="status" role="status">尚未执行</span></div>

    <p class="foot" id="note">教学示例在本地 Web Worker 中运行，支持 Promise、queueMicrotask、setTimeout。没有 DOM；单次约 1.2 秒后结束，超时强制停止。不要输入密码或隐私信息。</p>
  </section>
